name: Fetch Sportzfy Data & Generate Pages

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  fetch-and-generate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Fetch external JSON and generate pages
      run: |
        python fetch_and_generate.py
        
    - name: Commit and push changes
      env:
        PAT: ${{ secrets.SPORTLINK_PAT }}
      run: |
        git config --global user.name 'sportlive18'
        git config --global user.email 'sportlive18@users.noreply.github.com'
        git add world-sports/
        git add api/
        git diff --staged --quiet || (git commit -m "Auto-update: Sportzfy pages $(date +'%Y-%m-%d %H:%M:%S')" && git push https://sportlive18:${PAT}@github.com/sportlive18/Sportlink-Live.git HEAD:main)
