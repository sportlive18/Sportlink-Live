name: Scrape World Sports

on:
  schedule:
    - cron: "*/5 * * * *"      # every 5 min — adjust as you like
  workflow_dispatch:            # allow manual run

permissions:
  contents: write               # needed to commit output back

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"          # caches ~/.cache/pip between runs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        run: python fetch_and_generate.py

      - name: Commit & push updated JSON
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/world-sports.json world-sports/world-sports.json
          git diff --staged --quiet || git commit -m "chore: update world-sports.json"
          git push
