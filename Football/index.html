<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080B10">
<meta name="referrer" content="no-referrer">
<title>Sportlink — Live Sports Streaming</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@5.2.4/dist/controls.css">

<style>
/* ============================================================
   THEME — "Midnight Mint"
   ============================================================ */
:root{
  --bg:#080B10; --surface:#0F141C; --surface-2:#151C26; --surface-3:#1C2531;
  --border:#212B39; --border-2:#2C3848;
  --text:#EDF2F9; --text-dim:#A3B3C6; --muted:#6E7E94;
  --accent:#00E5B0; --accent-2:#22D3EE;
  --accent-soft:rgba(0,229,176,.12); --accent-glow:rgba(0,229,176,.25);
  --live:#FF4D6D; --live-soft:rgba(255,77,109,.12);
  --soon:#FFB020; --soon-soft:rgba(255,176,32,.12);
  --done:#6E7E94; --done-soft:rgba(110,126,148,.12);
  --radius:18px; --radius-md:14px;
  --shadow:0 4px 24px rgba(0,0,0,.35); --shadow-lg:0 24px 60px rgba(0,0,0,.5);
  --font-d:'Space Grotesk','Inter',system-ui,sans-serif;
  --font-b:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font:400 15px/1.5 var(--font-b); color:var(--text); background:var(--bg);
  min-height:100vh; -webkit-font-smoothing:antialiased;
  padding-bottom:40px; position:relative; overflow-x:hidden;
}
body::before{
  content:""; position:fixed; top:-30%; left:50%; transform:translateX(-50%);
  width:900px; height:900px;
  background:radial-gradient(circle,rgba(0,229,176,.07),transparent 65%);
  pointer-events:none; z-index:0;
}
body::after{
  content:""; position:fixed; bottom:-40%; right:-10%; width:700px; height:700px;
  background:radial-gradient(circle,rgba(34,211,238,.05),transparent 70%);
  pointer-events:none; z-index:0;
}

button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
img{display:block;max-width:100%}
[hidden]{display:none !important}

/* ============================================================
   LAYOUT
   ============================================================ */
.container{max-width:1320px;margin:0 auto;padding:0 20px;position:relative;z-index:1}
.view{display:none}
.view.active{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============================================================
   HEADER
   ============================================================ */
.header{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:22px 0 20px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:14px}
.brand-mark{
  width:46px;height:46px;border-radius:14px;
  background:linear-gradient(135deg,#00E5B0,#22D3EE);
  display:grid;place-items:center;font-size:22px;
  box-shadow:0 6px 24px var(--accent-glow); flex:none;
}
.brand-text h1{
  font:700 22px/1.1 var(--font-d); letter-spacing:-.01em;
  background:linear-gradient(100deg,#fff 30%,#00E5B0 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand-text p{font-size:12.5px;color:var(--muted);margin-top:2px;font-weight:500}

.header-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.live-pill{
  display:flex;align-items:center;gap:7px;
  padding:7px 14px;border-radius:999px;
  background:var(--live-soft);border:1px solid rgba(255,77,109,.25);
  color:var(--live);font-size:12.5px;font-weight:600;
}
.live-pill .dot{
  width:7px;height:7px;border-radius:50%;background:var(--live);
  animation:pulse 1.3s infinite;
}
@keyframes pulse{50%{opacity:.3}}
.clock{font-size:12.5px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.join-btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 16px;border-radius:999px;
  background:linear-gradient(135deg,#00E5B0,#22D3EE);
  color:#04110D;font-size:13px;font-weight:700;
  transition:transform .18s ease,box-shadow .18s ease;
  box-shadow:0 4px 16px var(--accent-glow);
}
.join-btn:hover{transform:translateY(-1px);box-shadow:0 6px 22px var(--accent-glow)}
.join-btn svg{width:15px;height:15px}

/* ============================================================
   FILTERS
   ============================================================ */
.filters{
  display:flex;flex-direction:column;gap:10px;
  padding:4px 0 22px;border-bottom:1px solid var(--border);margin-bottom:24px;
}
.filter-row{
  display:flex;gap:8px;overflow-x:auto;padding:2px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.filter-row::-webkit-scrollbar{display:none}

.pill{
  flex:none;display:inline-flex;align-items:center;gap:7px;
  padding:9px 15px;border-radius:999px;
  font-size:13.5px;font-weight:600;
  color:var(--text-dim);background:var(--surface);
  border:1px solid var(--border);transition:all .18s ease;white-space:nowrap;
}
.pill:hover{color:var(--text);border-color:var(--border-2);background:var(--surface-2)}
.pill.active{color:var(--accent);background:var(--accent-soft);border-color:var(--accent)}
.pill .count{
  font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;
  background:var(--surface-3);color:var(--muted);
}
.pill.active .count{background:rgba(0,229,176,.2);color:var(--accent)}
.pill[data-tab="live"].active{color:var(--live);background:var(--live-soft);border-color:var(--live)}
.pill[data-tab="live"].active .count{background:rgba(255,77,109,.2);color:var(--live)}

/* ============================================================
   MATCH GRID
   ============================================================ */
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
  gap:16px;padding-bottom:48px;
}

.card{
  display:flex;flex-direction:column;gap:14px;padding:18px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);
  text-align:left;font:inherit;color:inherit;
  transition:border-color .2s ease,transform .2s ease,box-shadow .2s ease,background .2s ease;
  cursor:pointer;position:relative;overflow:hidden;
}
.card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  opacity:0;transition:opacity .25s ease;
}
.card:hover{border-color:var(--border-2);transform:translateY(-3px);box-shadow:var(--shadow);background:var(--surface-2)}
.card:hover::before{opacity:.7}
.card.is-live::before{background:linear-gradient(90deg,transparent,var(--live),transparent);opacity:.9}
.card.is-live{border-color:rgba(255,77,109,.25)}

.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sport-chip{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:var(--muted);min-width:0;
}
.sport-chip .icon{font-size:14px;flex:none}
.sport-chip .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.status{
  flex:none;font-size:10.5px;font-weight:700;letter-spacing:.06em;
  padding:4px 10px;border-radius:999px;text-transform:uppercase;
}
.status.live{color:var(--live);background:var(--live-soft);border:1px solid rgba(255,77,109,.3)}
.status.soon{color:var(--soon);background:var(--soon-soft);border:1px solid rgba(255,176,32,.3)}
.status.done{color:var(--done);background:var(--done-soft);border:1px solid rgba(110,126,148,.25)}

.card-body{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:6px 0}
.team{display:flex;flex-direction:column;align-items:center;gap:9px;min-width:0}
.crest{
  width:56px;height:56px;border-radius:50%;
  background:var(--surface-3);border:1px solid var(--border);
  display:grid;place-items:center;overflow:hidden;position:relative;
  font-weight:700;font-size:15px;color:var(--muted);flex:none;
}
.crest img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--surface-3);padding:4px}
.team-name{
  font-size:13px;font-weight:600;text-align:center;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.versus{display:flex;flex-direction:column;align-items:center;gap:2px;padding:0 4px}
.kickoff-time{font:700 20px/1 var(--font-d);color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.kickoff-date{font-size:11px;color:var(--muted);font-weight:500;white-space:nowrap}

.card-foot{
  display:flex;align-items:center;justify-content:space-between;
  padding-top:12px;border-top:1px solid var(--border);font-size:12px;
}
.stream-count{color:var(--muted);font-weight:500}
.stream-count.empty{color:var(--live)}
.watch-cta{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:700;font-size:12.5px;transition:gap .18s ease}
.card:hover .watch-cta{gap:8px}
.watch-cta .arrow{transition:transform .18s ease}
.card:hover .watch-cta .arrow{transform:translateX(2px)}

/* ============================================================
   PLAYER VIEW
   ============================================================ */
.player-top{display:flex;align-items:center;gap:14px;padding:22px 0 20px;flex-wrap:wrap}
.icon-btn{
  width:44px;height:44px;border-radius:14px;
  border:1px solid var(--border);background:var(--surface);
  display:grid;place-items:center;font-size:18px;color:var(--text);
  transition:all .18s ease;flex:none;
}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--surface-2)}
.player-meta{flex:1;min-width:0}
.player-title{font:700 clamp(19px,3.5vw,26px)/1.15 var(--font-d);letter-spacing:-.01em;overflow-wrap:anywhere}
.player-sub{color:var(--muted);font-size:13px;margin-top:3px;font-weight:500}

.screen{
  position:relative;background:#000;
  border-radius:var(--radius);overflow:hidden;
  aspect-ratio:16/9;width:100%;
  max-width:min(980px, calc((100vh - 180px) * 16 / 9));
  max-width:min(980px, calc((100dvh - 180px) * 16 / 9));
  margin:0 auto;border:1px solid var(--border);box-shadow:var(--shadow-lg);
}
@media (max-height:520px){
  .screen{
    max-width:min(980px, calc((100vh - 100px) * 16 / 9));
    max-width:min(980px, calc((100dvh - 100px) * 16 / 9));
    border-radius:12px;
  }
  .player-top{padding:12px 0 12px}
  .player-title{font-size:16px}
  .player-sub{display:none}
}

#player-container{position:absolute;inset:0;background:#000}
#player-container video{
  width:100%;height:100%;object-fit:contain;background:#000;display:block;
}
#player-container video.mode-fill{object-fit:fill}
#player-container video.mode-cover{object-fit:cover}

#player-container:fullscreen{width:100%;height:100%;background:#000}
#player-container:-webkit-full-screen{width:100%;height:100%;background:#000}

/* ============================================================
   STATUS TOAST
   ============================================================ */
#status{
  position:absolute;top:12px;left:12px;
  transform:translateY(-10px);
  z-index:9998;
  display:flex;align-items:center;gap:7px;
  padding:6px 15px 6px 11px;
  background:rgba(10,10,10,.92);
  border:1px solid rgba(255,255,255,.07);
  font-size:11.5px;font-weight:500;letter-spacing:.2px;
  border-radius:24px;pointer-events:none;
  opacity:0;transition:opacity .25s ease,transform .25s ease;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;
  box-shadow:0 2px 14px rgba(0,0,0,.45);
  color:#c0c0c0;
}
#status.show{opacity:1;transform:translateY(0)}
#status.ok .st-dot{background:#60a5fa}
#status.live{color:#c8c8c8}
#status.live .st-dot{background:#22d3a0;animation:dot-pulse 2s ease-in-out infinite}
#status.warn{color:#fcd34d}
#status.warn .st-dot{background:#fb923c;animation:dot-pulse 1s ease-in-out infinite}
#status.err{color:#fca5a5}
#status.err .st-dot{background:#f87171}
.st-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}
@keyframes dot-pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.35;transform:scale(.55)}
}

/* ============================================================
   LOADING OVERLAY
   ============================================================ */
.loading-overlay{
  position:absolute;inset:0;z-index:9997;
  background:rgba(0,0,0,.85);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.loading-overlay svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-overlay p{color:#8f9baa;font-size:12.5px;letter-spacing:.5px;text-align:center;padding:0 24px;font-weight:500}

/* ============================================================
   SHAKA FIT BUTTON (only for DASH)
   ============================================================ */
.sp-btn{
  background:transparent!important;border:none!important;cursor:pointer!important;
  padding:0 8px!important;opacity:.75;
  display:flex;align-items:center;justify-content:center;
  height:100%;min-width:36px;
  transition:opacity .15s,color .15s;
  color:#fff!important;-webkit-tap-highlight-color:transparent;
}
.sp-btn:hover{opacity:1}
.sp-btn:active{opacity:1;transform:scale(.9)}
.sp-btn:focus-visible{outline:2px solid #38bdf8;outline-offset:2px;border-radius:6px}
.sp-btn.active{opacity:1;color:#38bdf8!important}
.sp-fit-btn{padding:0 7px!important;min-width:auto!important}
.fit-pill{
  font-size:10px;font-weight:700;letter-spacing:.4px;
  padding:3px 7px;border-radius:4px;line-height:1;
  border:1.5px solid rgba(255,255,255,.28);
  color:rgba(255,255,255,.8);
  pointer-events:none;white-space:nowrap;
  transition:border-color .2s,color .2s;
}
.sp-fit-btn:hover .fit-pill{border-color:rgba(255,255,255,.55);color:#fff}
.sp-fit-btn.mode-fill .fit-pill{border-color:#38bdf8;color:#38bdf8}
.sp-fit-btn.mode-cover .fit-pill{border-color:#a78bfa;color:#a78bfa}

/* ============================================================
   SHAKA UI OVERRIDES (DASH only)
   ============================================================ */
.shaka-controls-container button{color:#fff!important}
.shaka-video-container{background-color:#000!important}
.shaka-spinner-container{display:none!important}

.shaka-video-container .shaka-scrim-container{
  background:linear-gradient(180deg,
    rgba(0,0,0,.5) 0%, transparent 25%, transparent 55%, rgba(0,0,0,.75) 100%) !important;
}
.shaka-video-container .shaka-bottom-controls{
  padding-bottom:max(env(safe-area-inset-bottom,0px),6px) !important;
}
.shaka-overflow-menu,
.shaka-settings-menu{
  background-color:rgba(15,20,28,.97) !important;
  border:1px solid #212B39 !important;
  border-radius:14px !important;
  padding:6px !important;
  box-shadow:0 16px 40px rgba(0,0,0,.7) !important;
}
.shaka-overflow-menu li,
.shaka-settings-menu li{padding:0 !important;margin:2px 0 !important}
.shaka-overflow-menu button,
.shaka-settings-menu button{
  color:#EDF2F9 !important;padding:10px 14px !important;
  border-radius:8px !important;font-size:13px !important;
  transition:background .15s ease,color .15s ease !important;
}
.shaka-overflow-menu button:hover,
.shaka-settings-menu button:hover{background-color:rgba(255,255,255,.06) !important}
.shaka-settings-menu button.shaka-chosen-item{
  color:#00E5B0 !important;background-color:rgba(0,229,176,.12) !important;
}
.shaka-settings-menu .shaka-back-to-overflow-button{
  color:#00E5B0 !important;border-bottom:1px solid #212B39 !important;margin-bottom:4px !important;
}
.shaka-play-button{filter:drop-shadow(0 4px 16px rgba(0,229,176,.35)) !important}
.shaka-video-container .shaka-range-element{accent-color:#00E5B0}

/* ============================================================
   JW PLAYER UI OVERRIDES (HLS only)
   ============================================================ */
.jw-wrapper{background:#000 !important}
.jw-controls{background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.75)) !important}
.jw-button-color{color:#fff !important}
.jw-button-color:hover{color:var(--accent) !important}
.jw-icon-playback,
.jw-icon-volume,
.jw-icon-fullscreen,
.jw-icon-settings{color:#fff !important}
.jw-slider-time .jw-buffer{background:#ffc336 !important}
.jw-slider-time .jw-progress{background:#1fc7ff !important}
.jw-slider-time .jw-rail{background:#828282 !important}
.jw-display-icon-container{background:rgba(0,0,0,.55) !important;border-radius:50% !important}
.jw-display-icon-container:hover{background:rgba(0,229,176,.25) !important}
.jw-text{color:#fff !important}
.jw-menu,
.jw-settings-menu{background:rgba(15,20,28,.97) !important;border:1px solid #212B39 !important;border-radius:14px !important}
.jw-menu .jw-option,
.jw-settings-menu .jw-option{color:#EDF2F9 !important}
.jw-menu .jw-option.jw-active-option,
.jw-settings-menu .jw-option.jw-active-option{color:var(--accent) !important}
.jw-settings-menu .jw-settings-topbar{background:transparent !important;border-bottom:1px solid #212B39 !important}
.jw-settings-menu .jw-settings-topbar .jw-button-color{color:var(--accent) !important}
.jw-logo{display:none !important}

/* JW Player fit button */
.jw-fit-btn{
  background:transparent!important;border:none!important;cursor:pointer!important;
  padding:0 7px!important;opacity:.8;display:flex;align-items:center;justify-content:center;
  height:100%;min-width:36px;transition:opacity .15s,color .15s;
  color:#fff!important;-webkit-tap-highlight-color:transparent;
}
.jw-fit-btn:hover{opacity:1}
.jw-fit-btn:active{opacity:1;transform:scale(.9)}
.jw-fit-btn:focus-visible{outline:2px solid #38bdf8;outline-offset:2px;border-radius:6px}
.jw-fit-btn.mode-fill .fit-pill{border-color:#38bdf8;color:#38bdf8}
.jw-fit-btn.mode-cover .fit-pill{border-color:#a78bfa;color:#a78bfa}

/* ============================================================
   STREAM LIST
   ============================================================ */
.section-title{
  font:600 13px var(--font-b);letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);max-width:980px;margin:28px auto 12px;
}
.streams{display:flex;flex-direction:column;gap:8px;max-width:980px;margin:0 auto}
.stream-btn{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  width:100%;padding:14px 16px;border-radius:var(--radius-md);
  text-align:left;color:var(--text);
  border:1px solid var(--border);background:var(--surface);
  transition:all .18s ease;
}
.stream-btn:hover{border-color:var(--border-2);background:var(--surface-2)}
.stream-btn.active{
  border-color:var(--accent);background:var(--accent-soft);
  box-shadow:0 0 0 1px var(--accent) inset;
}
.stream-btn .title{
  font-weight:600;font-size:14px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.stream-btn .tags{display:flex;align-items:center;gap:8px;flex:none}
.type-badge{
  font-size:10px;font-weight:700;letter-spacing:.06em;
  padding:3px 9px;border-radius:999px;
  background:var(--surface-3);color:var(--text-dim);
}
.type-badge.dash{color:#8B9DFF;background:rgba(139,157,255,.12)}
.type-badge.hls{color:#FFB020;background:rgba(255,176,32,.12)}
.stream-btn.active .type-badge{background:rgba(0,229,176,.18);color:var(--accent)}

/* ============================================================
   STATES
   ============================================================ */
.state{
  grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:80px 20px;gap:14px;text-align:center;
}
.state h3{font:600 18px var(--font-d);color:var(--text)}
.state p{color:var(--muted);font-size:13.5px;max-width:400px}
.err-icon{
  width:48px;height:48px;border-radius:50%;
  background:var(--live-soft);color:var(--live);
  display:grid;place-items:center;font-size:22px;
}
.screen-msg{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;color:var(--muted);font-size:14px;text-align:center;padding:24px;
}
.screen-msg small{font-size:11.5px;opacity:.7;max-width:90%;overflow-wrap:anywhere}

/* ============================================================
   TELEGRAM POPUP
   ============================================================ */
#tgOverlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.85);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  display:none;align-items:center;justify-content:center;
  z-index:999999;padding:20px;
}
#tgOverlay.show{display:flex;animation:fadeInPopup .4s cubic-bezier(.25,.8,.25,1)}
@keyframes fadeInPopup{from{opacity:0}to{opacity:1}}

#tgCard{
  width:100%;max-width:400px;
  background:linear-gradient(160deg,#121A2F,#0A0F1D);
  border:1px solid rgba(0,229,176,.2);
  border-radius:24px;padding:36px 28px 28px;

<!-- Libraries -->
<script src="https://cdn.jsdelivr.net/npm/shaka-player@5.2.4/dist/shaka-player.ui.min.js"></script>
<script src="https://cdn.jwplayer.com/libraries/IDzF9Zmk.js"></script>

<script>
"use strict";

/* ============================================================
   CONFIG
   ============================================================ */
const DATA_URL  = "https://allrounderlive.in/api/football.json";
const LOG  = (...a) => console.log("[Sportlink]", ...a);
const ERR  = (...a) => console.error("[Sportlink]", ...a);

const $ = id => document.getElementById(id);

const state = {
  events: [],
  sport: "All",
  tab: "all",
  currentEvent: null,
  currentStreams: [],
  currentIndex: 0
};

/* ============================================================
   TELEGRAM POPUP CONTROLLER
   ============================================================ */
const TG = (function(){
  const overlay = document.getElementById("tgOverlay");

  function isOpen(){ return overlay.classList.contains("show"); }
  function open(){ overlay.classList.add("show"); try{ document.body.style.overflow = "hidden"; }catch(_){} }
  function close(){ overlay.classList.remove("show"); try{ document.body.style.overflow = ""; }catch(_){} }
  function markSeen(){ try{ sessionStorage.setItem("tg_popup_seen","1"); }catch(_){} }
  function wasSeen(){ try{ return sessionStorage.getItem("tg_popup_seen") === "1"; }catch(_){ return false; } }

  document.getElementById("joinNow").addEventListener("click", () => {
    window.open("https://t.me/sportlink10","_blank","noopener");
    markSeen(); close();
  });
  document.getElementById("joinedBtn").addEventListener("click", () => { markSeen(); close(); });
  overlay.addEventListener("click", (e) => {
    if(e.target === overlay){ markSeen(); close(); }
  });
  document.addEventListener("keydown", (e) => {
    if(e.key === "Escape" && isOpen()){ markSeen(); close(); }
  });

  return { open, close, isOpen, markSeen, wasSeen };
})();

/* ============================================================
   TIER / DEVICE PROFILE (for Shaka DASH)
   ============================================================ */
function getTier(){
  const mem   = navigator.deviceMemory || 4;
  const cores = navigator.hardwareConcurrency || 4;
  const mob   = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  const conn  = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  const net   = conn ? (conn.effectiveType || "4g") : "4g";

  if(!mob) return "high";
  if(mem <= 1.5 || cores <= 2 || net === "slow-2g" || net === "2g") return "low";
  if(mem <= 3 || cores <= 4) return "mid";
  return "high";
}

const TIER = getTier();
const PROF = {
  low : { buf:4,  reBuf:1.5, behind:10, maxH:480,  maxBw:1000000, bwEst:400000  },
  mid : { buf:7,  reBuf:1.5, behind:20, maxH:720,  maxBw:3000000, bwEst:1000000 },
  high: { buf:10, reBuf:1.5, behind:25, maxH:1080, maxBw:0,       bwEst:2000000 }
}[TIER];

/* ============================================================
   HELPERS
   ============================================================ */
function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function parseDate(value){
  if(!value) return null;
  let s = String(value).trim();
  if(!s || s === "null" || s === "undefined") return null;

  const isIST = /\bIST\b/i.test(s);
  if(isIST) s = s.replace(/\s*IST\s*$/i, "").trim();

  let m = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})[T\s](\d{1,2}):(\d{2})(?::(\d{2}))?(?:\.\d+)?\s*([+-]\d{2}:?\d{2}|Z)?$/);
  if(m){
    const [,y,mo,d,h,mi,se="00",off] = m;
    let offset = "+0000";
    if(off) offset = off === "Z" ? "+0000" : (off.includes(":") ? off.replace(":","") : off);
    else if(isIST) offset = "+0530";
    const iso = `${y}-${mo.padStart(2,"0")}-${d.padStart(2,"0")}T${h.padStart(2,"0")}:${mi}:${se}${offset.slice(0,3)}:${offset.slice(3)}`;
    const dt = new Date(iso);
    if(!isNaN(dt.getTime())) return dt;
  }

  const MONTHS = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
  m = s.match(/^(\d{1,2})\s+([A-Za-z]{3,})\s+(\d{4})[,\s]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?\s*([+-]\d{2}:?\d{2})?$/i);
  if(m){
    const [,d,mon,y,h,mi,se="00",ampm,off] = m;
    const mi2 = MONTHS[mon.toLowerCase().slice(0,3)];
    if(mi2 !== undefined){
      let hour = parseInt(h,10);
      if(ampm){
        if(ampm.toUpperCase() === "PM" && hour < 12) hour += 12;
        if(ampm.toUpperCase() === "AM" && hour === 12) hour = 0;
      }
      const offset = off ? (off.includes(":") ? off.replace(":","") : off) : (isIST ? "+0530" : "+0000");
      const iso = `${y}-${String(mi2+1).padStart(2,"0")}-${d.padStart(2,"0")}T${String(hour).padStart(2,"0")}:${mi}:${se}${offset.slice(0,3)}:${offset.slice(3)}`;
      const dt = new Date(iso);
      if(!isNaN(dt.getTime())) return dt;
    }
  }
  const dt = new Date(s);
  return isNaN(dt.getTime()) ? null : dt;
}

function getStatus(e){
  const now = Date.now();
  if(now < e.st) return "soon";
  if(now <= e.en) return "live";
  return "done";
}

function duration(ms){
  const mins = Math.max(0, Math.round(ms / 60000));
  const h = Math.floor(mins / 60), m = mins % 60;
  if(h >= 24){ const d = Math.floor(h / 24); return `${d}d ${h % 24}h`; }
  if(h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}

function timeString(d){ return d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}); }
function dateString(d){ return d.toLocaleDateString([], {day:"numeric", month:"short"}); }

function sportIcon(sport){
  const s = String(sport).toLowerCase();
  if(s.includes("cricket")) return "🏏";
  if(s.includes("football") || s.includes("soccer")) return "⚽";
  if(s.includes("wwe") || s.includes("wrestling")) return "🤼";
  if(s.includes("basketball")) return "🏀";
  if(s.includes("tennis")) return "🎾";
  if(s.includes("baseball")) return "⚾";
  if(s.includes("hockey")) return "🏒";
  if(s.includes("motor") || s.includes("formula") || s.includes("motogp")) return "🏎️";
  if(s.includes("boxing")) return "🥊";
  if(s.includes("ufc") || s.includes("mma")) return "🥋";
  if(s.includes("snooker") || s.includes("pool")) return "🎱";
  if(s.includes("cycling")) return "🚴";
  return "🏆";
}

function crest(url, name){
  const initials = String(name || "")
    .replace(/[^A-Za-z0-9 ]/g,"").split(/\s+/).filter(Boolean)
    .map(x => x[0]).join("").slice(0,3).toUpperCase() || "?";
  if(!url || url === "null") return `<div class="crest">${esc(initials)}</div>`;
  return `<div class="crest">
    <span>${esc(initials)}</span>
    <img src="${esc(url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">
  </div>`;
}

/* ============================================================
   FETCH & NORMALIZE
   ============================================================ */
async function fetchJson(url){
  LOG("Fetching:", url);
  const res = await fetch(url, {cache:"no-store"});
  if(!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
  const text = await res.text();
  if(text.trim().startsWith("<")) throw new Error("Server returned HTML instead of JSON.");
  try{ return JSON.parse(text); }
  catch(err){ throw new Error("Invalid JSON: " + err.message); }
}

function normalize(data){
  if(!Array.isArray(data)) throw new Error("Expected a JSON array.");
  const events = [];
  let ok = 0, skipped = 0;

  data.forEach((item, index) => {
    try{
      const info = item.event || item.eventInfo || {};

      const st = parseDate(info.startTimeUTC) || parseDate(info.startTime)
              || parseDate(info.startTimeIST) || parseDate(item.startTime);
      if(!st){ skipped++; return; }

      let en = parseDate(info.endTimeUTC) || parseDate(info.endTime)
            || parseDate(info.endTimeIST) || parseDate(item.endTime);
      if(!en || en <= st) en = new Date(st.getTime() + 3 * 3600000);

      const rawStreams = []
        .concat(Array.isArray(item.dashStreams) ? item.dashStreams : [])
        .concat(Array.isArray(item.streams) ? item.streams : [])
        .concat(Array.isArray(item.formats) ? item.formats : []);

      const seen = new Set();
      const streams = [];
      rawStreams.forEach((s, i) => {
        if(!s) return;
        const link = String(s.url || s.link || "").split("|")[0].trim();
        if(!link || !/^https?:\/\//i.test(link)) return;
        if(seen.has(link)) return;

        const t = String(s.type || "").toLowerCase();
        const isDash = t === "dash" || /\.mpd(\?|$)/i.test(link);
        const isHls  = t === "hls"  || /\.m3u8(\?|$)/i.test(link);
        if(!isDash && !isHls) return;

        seen.add(link);
        streams.push({
          title: String(s.title || s.name || `Stream ${i+1}`).trim(),
          link,
          type: isDash ? "DASH" : "HLS",
          key: String(s.key || s.api || "").trim()
        });
      });

      events.push({
        id: item.id ?? String(index),
        sport: String(info.category || info.sport || item.cat || "Other").trim(),
        comp: String(info.name || info.competition || item.title || "").trim(),
        a: info.teamA || info.home || "",
        b: info.teamB || info.away || "",
        fa: info.teamAFlag || info.homeFlag || "",
        fb: info.teamBFlag || info.awayFlag || "",
        st, en, streams
      });
      ok++;
    }catch(err){
      ERR(`Event #${index} error:`, err);
      skipped++;
    }
  });
  LOG(`Normalize done — ok=${ok}, skipped=${skipped}`);
  return events;
}

async function loadData(){
  try{
    const raw = await fetchJson(DATA_URL);
    state.events = normalize(raw);
    if(!state.events.length){
      $("list").innerHTML = `<div class="state">
        <div class="err-icon">!</div>
        <h3>No events found</h3>
        <p>The feed loaded but no matches had a usable start time.</p>
      </div>`;
      return;
    }
    renderHub();
    if(!window.__booted){
      window.__booted = true;
      route();
      maybeShowHubPopup();
    }
  }catch(err){
    ERR("Load failed:", err);
    $("list").innerHTML = `<div class="state">
      <div class="err-icon">!</div>
      <h3>Could not load events</h3>
      <p>${esc(err.message)}</p>
    </div>`;
  }
}

/* ============================================================
   HUB POPUP (landing page only, once per session)
   ============================================================ */
function maybeShowHubPopup(){
  if(TG.wasSeen()) return;
  if(location.hash.includes("watch")) return;
  setTimeout(() => {
    if(!TG.isOpen() && !location.hash.includes("watch")){
      TG.open();
    }
  }, 3000);
}

/* ============================================================
   HUB RENDERING
   ============================================================ */
function eventCard(e){
  const status = getStatus(e);
  const now = Date.now();
  const isLive = status === "live";

  let statusClass = "", statusText = "";
  if(status === "live"){ statusClass = "live"; statusText = "Live"; }
  else if(status === "soon"){ statusClass = "soon"; statusText = `in ${duration(e.st - now)}`; }
  else { statusClass = "done"; statusText = "Finished"; }

  const n = e.streams.length;
  const streamInfo = n === 0
    ? `<span class="stream-count empty">No streams</span>`
    : `<span class="stream-count">${n} stream${n > 1 ? "s" : ""}</span>`;

  const sameTeam = !e.b || e.a === e.b;
  const sideA = `<div class="team">${crest(e.fa, e.a || e.comp)}<div class="team-name">${esc(e.a || e.comp || "TBD")}</div></div>`;
  const sideB = sameTeam ? `<div class="team"></div>` :
    `<div class="team">${crest(e.fb, e.b)}<div class="team-name">${esc(e.b)}</div></div>`;

  return `
    <button class="card ${isLive ? "is-live" : ""}" data-watch-event="${esc(e.id)}"
            type="button" aria-label="${esc(e.a)} vs ${esc(e.b || "TBD")}">
      <div class="card-top">
        <span class="sport-chip">
          <span class="icon">${sportIcon(e.sport)}</span>
          <span class="name">${esc(e.sport)}${e.comp ? " · " + esc(e.comp) : ""}</span>
        </span>
        <span class="status ${statusClass}">${statusText}</span>
      </div>
      <div class="card-body">
        ${sideA}
        <div class="versus">
          <div class="kickoff-time">${timeString(e.st)}</div>
          <div class="kickoff-date">${dateString(e.st)} · IST</div>
        </div>
        ${sideB}
      </div>
      <div class="card-foot">
        ${streamInfo}
        <span class="watch-cta">Watch <span class="arrow">→</span></span>
      </div>
    </button>
  `;
}

function renderHub(){
  const counts = {live:0, soon:0, done:0};
  state.events.forEach(e => counts[getStatus(e)]++);

  const sports = ["All", ...new Set(state.events.map(e => e.sport).filter(Boolean))];
  $("sports").innerHTML = sports.map(s => {
    const n = s === "All" ? state.events.length : state.events.filter(e => e.sport === s).length;
    return `<button class="pill ${state.sport === s ? "active" : ""}"
                   data-sport="${esc(s)}" role="tab">
      ${s === "All" ? "🏆" : sportIcon(s)} ${esc(s)}
      <span class="count">${n}</span>
    </button>`;
  }).join("");

  const tabs = [
    ["all", "All", state.events.length],
    ["live", "Live", counts.live],
    ["soon", "Upcoming", counts.soon]
  ];
  $("tabs").innerHTML = tabs.map(([key, label, n]) =>
    `<button class="pill ${state.tab === key ? "active" : ""}"
             data-tab="${key}" role="tab">
      ${key === "live" ? "🔴" : key === "soon" ? "📅" : "✅"} ${label}
      <span class="count">${n}</span>
    </button>`
  ).join("");

  const rows = state.events
    .filter(e =>
      (state.tab === "all" || getStatus(e) === state.tab) &&
      (state.sport === "All" || e.sport === state.sport)
    )
    .sort((a, b) => {
      const order = {live:0, soon:1, done:2};
      const sa = order[getStatus(a)] ?? 3, sb = order[getStatus(b)] ?? 3;
      if(sa !== sb) return sa - sb;
      return a.st - b.st;
    });

  $("list").innerHTML = rows.length
    ? rows.map(eventCard).join("")
    : `<div class="state"><h3>No matches found</h3><p>Try a different filter.</p></div>`;

  $("clock").textContent = new Date().toLocaleString([], {
    day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"
  }) + " IST";
}

/* ============================================================
   ROUTER
   ============================================================ */
function route(){
  const raw = location.hash.replace(/^#\/?/, "");
  const [path, qs] = raw.split("?");
  const params = new URLSearchParams(qs || "");
  if(path === "watch") openPlayer(params.get("id"), Number(params.get("stream") || 0));
  else showHub();
}

function showHub(){
  stopPlayback();
  state.currentEvent = null;
  state.currentStreams = [];
  $("playerView").classList.remove("active");
  $("hubView").classList.add("active");
  window.scrollTo(0, 0);
}

async function openPlayer(id, index){
  $("hubView").classList.remove("active");
  $("playerView").classList.add("active");
  window.scrollTo(0, 0);

  const event = state.events.find(e => String(e.id) === String(id));
  if(!event){
    state.currentEvent = null;
    state.currentStreams = [];
    $("playerTitle").textContent = "Match not found";
    $("playerSub").textContent = "";
    $("streams").innerHTML = "";
    $("player-container").innerHTML = `<div class="screen-msg">This match is no longer available.</div>`;
    return;
  }

  state.currentEvent = event;
  state.currentStreams = event.streams || [];
  state.currentIndex = index;

  tgShownForMatch = false;

  $("playerTitle").textContent = event.a && event.b
    ? `${event.a} vs ${event.b}` : (event.comp || "Sportlink Player");
  $("playerSub").textContent = [event.sport, event.comp].filter(Boolean).join(" · ");

  renderPlayerStreams(index);

  const record = state.currentStreams[index];
  if(record) await playRecord(record, index);
  else $("player-container").innerHTML =
    `<div class="screen-msg">No playable streams for this match.</div>`;
}

function toast(msg, type, dur){
  const el = $("status");
  if(!el) return;
  el.innerHTML = `<span class="st-dot"></span><span>${esc(msg)}</span>`;
  el.className = "show " + (type || "ok");
  clearTimeout(el.__tmr);
  if(dur !== 0){
    el.__tmr = setTimeout(() => {
      el.className = el.className.replace("show","").trim();
    }, dur || 4000);
  }
}

function ratioLabel(w,h){
  if(!w || !h) return "—";
  const gcd = (a,b) => b ? gcd(b,a%b) : a;
  const g = gcd(w,h) || 1;
  const rw = w/g, rh = h/g;
  const named = {"16:9":16/9,"4:3":4/3,"21:9":21/9,"1:1":1,"9:16":9/16,"3:2":3/2,"5:4":5/4,"2:1":2};
  const real = w/h;
  let best = null, bestD = .02;
  Object.keys(named).forEach(k => {
    const d = Math.abs(named[k] - real);
    if(d < bestD){ bestD = d; best = k; }
  });
  if(best) return best;
  if(rw <= 40 && rh <= 40) return rw + ":" + rh;
  return real.toFixed(2) + ":1";
}

/* ============================================================
   FIT / FILL / ZOOM BUTTON (generic, for both players)
   ============================================================ */
function createFitButton(vid, container, insertInto, className, pillClass){
  if(!container || !vid || !insertInto) return false;
  if(container.querySelector("." + className)) return true;

  const FITS = ["contain","fill","cover"];
  const FIT_LABELS = {contain:"Fit", fill:"Fill", cover:"Zoom"};
  let fitIdx = 0;

  const fitBtn = document.createElement("button");
  fitBtn.className = className;
  fitBtn.title = "Video Fit: Fit";
  fitBtn.setAttribute("aria-label", "Cycle Video Fit Mode");
  fitBtn.innerHTML = `<span class="fit-pill">—</span>`;
  fitBtn.type = "button";
  insertInto.appendChild(fitBtn);

  let currentRatio = "—";

  function applyFit(i){
    fitIdx = i;
    const m = FITS[i];
    vid.classList.remove("mode-fill","mode-cover");
    if(m === "fill") vid.classList.add("mode-fill");
    if(m === "cover") vid.classList.add("mode-cover");

    fitBtn.classList.remove("mode-fill","mode-cover");
    if(m !== "contain") fitBtn.classList.add("mode-" + m);
    fitBtn.title = "Video Fit: " + FIT_LABELS[m];
    const pill = fitBtn.querySelector(".fit-pill");
    if(pill) pill.textContent = m === "contain" ? currentRatio : FIT_LABELS[m];
  }

  fitBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    applyFit((fitIdx + 1) % FITS.length);
  });

  ["fullscreenchange","webkitfullscreenchange"].forEach(ev => {
    document.addEventListener(ev, () => {
      if(!document.fullscreenElement && !document.webkitFullscreenElement) applyFit(0);
    });
  });

  let ratioTries = 0;
  function updateRatio(){
    const pill = fitBtn.querySelector(".fit-pill");
    if(!pill) return;
    if(vid.videoWidth > 0){
      currentRatio = ratioLabel(vid.videoWidth, vid.videoHeight);
      if(FITS[fitIdx] === "contain") pill.textContent = currentRatio;
      ratioTries = 0;
    } else if(ratioTries < 15){
      ratioTries++;
      setTimeout(updateRatio, 700);
    }
  }
  vid.addEventListener("loadedmetadata", () => { ratioTries = 0; updateRatio(); });
  vid.addEventListener("resize", updateRatio);
  vid.addEventListener("timeupdate", function onFirst(){
    vid.removeEventListener("timeupdate", onFirst);
    updateRatio();
  });
  updateRatio();
  return true;
}

/* ============================================================
   JW PLAYER (HLS / M3U8 ONLY)

let jwInstance = null;
let jwRetries = 0;
let jwRefreshing = false;
let jwStarted = false;
let jwStallTmr = null;

async function destroyJwPlayer(){
  if(jwStallTmr){ clearTimeout(jwStallTmr); jwStallTmr = null; }
  if(jwInstance){
    try{ jwInstance.remove(); }catch(e){}
    jwInstance = null;
  }
}

function mountJwPlayer(record, token){
  const container = $("player-container");
  container.innerHTML = "";

  const playerEl = document.createElement("div");
  playerEl.id = "jw-player";
  playerEl.style.width = "100%";
  playerEl.style.height = "100%";
  playerEl.style.position = "absolute";
  playerEl.style.inset = "0";
  container.appendChild(playerEl);

  const statusEl = document.createElement("div");
  statusEl.id = "status";
  container.appendChild(statusEl);

  const loadEl = document.createElement("div");
  loadEl.className = "loading-overlay";
  loadEl.id = "loadingOverlay";
  loadEl.innerHTML = `
    <svg width="34" height="34" viewBox="0 0 40 40" fill="none">
      <circle cx="20" cy="20" r="16" stroke="#1a1a1a" stroke-width="4"/>
      <path d="M20 4a16 16 0 0 1 16 16" stroke="#00E5B0" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <p>Loading HLS stream…</p>
  `;
  container.appendChild(loadEl);

  try{
    jwInstance = jwplayer(playerEl);
    jwInstance.setup({
      file: record.link,
      autostart: true,
      mute: true,
      primary: "html5",
      hlshtml: true,
      width: "100%",
      height: "100%",
      aspectratio: "16:9",
      controls: true,
      displaytitle: false,
      displaydescription: false,
      stretching: "uniform",
      playbackRateControls: false,
      preload: "auto",
      skin: {
        name: "none",
        active: "#00E5B0",
        inactive: "#EDF2F9",
        background: "rgba(0,0,0,0)",
        color: "#00E5B0"
      }
    });
  }catch(e){
    ERR("JW Player setup failed:", e);
    loadEl.hidden = true;
    toast("Player could not start.", "err", 6000);
    return;
  }

  const vid = jwInstance.getContainer().querySelector("video");
  if(!vid){
    loadEl.hidden = true;
    toast("Video element not found.", "err", 6000);
    return;
  }

  const streamInfo = { url: record.link, type: record.type };
  currentStreamInfo = streamInfo;

  // Inject fit button
  let tries = 0;
  (function tryInject(){
    if(container.querySelector(".jw-fit-btn")) return;
    const controlBar = container.querySelector(".jw-controlbar");
    if(!controlBar){
      if(++tries < 25) setTimeout(tryInject, 150);
      return;
    }
    createFitButton(vid, container, controlBar, "jw-fit-btn");
  })();

  // JW event handlers
  jwInstance.on("ready", () => {
    if(token !== playbackToken) return;
    loadEl.hidden = true;
    toast("Ready — Tap ▶ To Play", "ok", 5000);
    vid.muted = true;
    jwInstance.play().catch(() => LOG("Autoplay blocked"));
  });

  jwInstance.on("play", () => {
    if(token !== playbackToken) return;
    jwStarted = true;
    if(jwStallTmr){ clearTimeout(jwStallTmr); jwStallTmr = null; }
    if(!jwRefreshing) toast("Live", "live", 3000);
    showPlayerTGPopup();
  });

  jwInstance.on("buffer", () => {
    if(token !== playbackToken) return;
    toast("Buffering…", "warn", 0);
  });

  jwInstance.on("bufferChange", (e) => {
    if(token !== playbackToken) return;
    if(e.buffering){
      if(jwStallTmr) return;
      toast("Buffering…", "warn", 0);
      if(!jwStarted || jwRefreshing) return;
      jwStallTmr = setTimeout(() => {
        jwStallTmr = null;
        reloadJw();
      }, 6000);
    } else {
      if(jwStallTmr){ clearTimeout(jwStallTmr); jwStallTmr = null; }
      toast("Live", "live", 3000);
    }
  });

  jwInstance.on("error", (e) => {
    if(token !== playbackToken) return;
    ERR("JW Player error:", e);
    if(jwRefreshing) return;
    toast("Buffering…", "warn", 0);
    setTimeout(() => { if(!jwRefreshing) reloadJw(); }, 500);
  });

  jwInstance.on("setupError", (e) => {
    ERR("JW Player setup error:", e);
    toast("Invalid HLS URL", "err", 6000);
  });

  // Reload logic
  async function reloadJw(){
    if(jwRefreshing) return;
    if(token !== playbackToken) return;
    if(!jwInstance) return;

    if(jwRetries >= 5){
      toast("Stream Unavailable. Please Try Again Later.", "err", 0);
      return;
    }

    jwRefreshing = true;
    jwRetries++;
    toast(`Reconnecting… (${jwRetries}/5)`, "warn", 0);

    try{
      jwInstance.load(streamInfo.url);
      if(token !== playbackToken){ jwRefreshing = false; return; }
      jwInstance.play().catch(()=>{});
      jwRetries = 0;
      toast("Live", "live", 4000);
      jwRefreshing = false;
    }catch(err){
      LOG(`JW reload attempt ${jwRetries} failed:`, err);
      const delay = Math.min(1000 * Math.pow(2, jwRetries - 1), 8000);
      setTimeout(() => {
        jwRefreshing = false;
        reloadJw();
      }, delay);
    }
  }

  // Unmute on interaction
  const unmuteOnce = () => { try{ jwInstance.setMute(false); }catch(_){} };
  container.addEventListener("pointerdown", unmuteOnce, {capture:true, once:true});
  container.addEventListener("click", unmuteOnce, {capture:true, once:true});
  container.addEventListener("keydown", unmuteOnce, {capture:true, once:true});

  // Wake lock
  if("wakeLock" in navigator){
    navigator.wakeLock.request("screen").catch(()=>{});
  }
}

/* ============================================================
   SHAKA PLAYER (DASH ONLY)
   ============================================================ */
let shakaPlayer = null;
let shakaOverlay = null;
let shakaRetries = 0;
let shakaRefreshing = false;
let shakaStarted = false;
let shakaStallTmr = null;
let shakaSessionStart = 0;
let shakaThermalTimer = null;
let shakaThermalApplied = false;
let shakaRestrictionsRelaxed = false;

async function destroyShakaPlayer(){
  if(shakaStallTmr){ clearTimeout(shakaStallTmr); shakaStallTmr = null; }
  if(shakaThermalTimer){ clearInterval(shakaThermalTimer); shakaThermalTimer = null; }
  if(shakaOverlay){ try{ shakaOverlay.destroy(); }catch(e){} shakaOverlay = null; }
  if(shakaPlayer){ try{ await shakaPlayer.destroy(); }catch(e){} shakaPlayer = null; }
  shakaSessionStart = 0; shakaThermalApplied = false; shakaRestrictionsRelaxed = false;
  shakaRefreshing = false; shakaRetries = 0; shakaStarted = false;
}

function buildShakaCfg(){
  const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  const effMaxH = shakaThermalApplied && mobile ? Math.min(PROF.maxH, 720) : PROF.maxH;
  const restr = {};
  if(!shakaRestrictionsRelaxed){
    if(effMaxH < 1080) restr.maxHeight = effMaxH;
    if(PROF.maxBw > 0) restr.maxBandwidth = PROF.maxBw;
  }
  return {
    manifest:{
      defaultPresentationDelay: 4,
      ignoreTextStreamFailures: true,
      retryParameters:{ maxAttempts:5, baseDelay:500, backoffFactor:2, fuzzFactor:.5, timeout:30000 }
    },
    streaming:{
      lowLatencyMode: false,
      bufferingGoal: PROF.buf,
      rebufferingGoal: PROF.reBuf,
      bufferBehind: PROF.behind,
      safeSeekOffset: 4,
      stallEnabled: true, stallThreshold: 1, stallSkip: .3,
      inaccurateManifestTolerance: 0,
      retryParameters:{ maxAttempts:5, baseDelay:500, backoffFactor:2, fuzzFactor:.5, timeout:30000 }
    },
    abr:{
      enabled: true,
      defaultBandwidthEstimate: PROF.bwEst,
      switchInterval: 4,
      restrictions: restr
    }
  };
}

function getClearKey(record){
  const raw = String(record && record.key || "").trim();
  if(!raw || !raw.includes(":")) return null;
  const parts = raw.split(":");
  if(parts.length < 2) return null;
  const kid = parts.shift().trim().replace(/^0x/i,"").toLowerCase();
  const key = parts.join(":").trim().replace(/^0x/i,"").toLowerCase();
  if(!/^[0-9a-f]+$/.test(kid) || !/^[0-9a-f]+$/.test(key)) return null;
  return {keyId: kid, key};
}

async function mountShakaPlayer(record, token){
  shaka.polyfill.installAll();
  if(!shaka.Player.isBrowserSupported()) throw new Error("Browser not supported.");

  const container = $("player-container");
  container.innerHTML = "";

  const vid = document.createElement("video");
  vid.id = "shaka-video";
  vid.playsInline = true;
  vid.setAttribute("playsinline","");
  vid.setAttribute("webkit-playsinline","");
  vid.preload = "none";
  vid.muted = true;
  vid.autoplay = true;
  container.appendChild(vid);

  const statusEl = document.createElement("div");
  statusEl.id = "status";
  container.appendChild(statusEl);

  const loadEl = document.createElement("div");
  loadEl.className = "loading-overlay";
  loadEl.id = "loadingOverlay";
  loadEl.innerHTML = `
    <svg width="34" height="34" viewBox="0 0 40 40" fill="none">
      <circle cx="20" cy="20" r="16" stroke="#1a1a1a" stroke-width="4"/>
      <path d="M20 4a16 16 0 0 1 16 16" stroke="#00E5B0" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <p>Loading DASH stream…</p>
  `;
  container.appendChild(loadEl);

  shakaPlayer = new shaka.Player();
  await shakaPlayer.attach(vid);

  shakaOverlay = new shaka.ui.Overlay(shakaPlayer, container, vid);
  shakaOverlay.configure({
    controlPanelElements: [
      "play_pause", "mute", "volume", "time_and_duration",
      "spacer", "picture_in_picture", "fullscreen", "overflow_menu"
    ],
    seekBarColors: { base:"#828282", buffered:"#ffc336", played:"#1fc7ff" }
  });

  // Inject fit button into Shaka control panel
  let tries = 0;
  (function tryInject(){
    if(container.querySelector(".sp-fit-btn")) return;
    const panel = container.querySelector(".shaka-controls-button-panel");
    if(!panel){
      if(++tries < 20) setTimeout(tryInject, 150);
      return;
    }
    const anchor = panel.querySelector(".shaka-fullscreen-button");
    const fitBtn = createFitButton(vid, container, panel, "sp-fit-btn");
    if(fitBtn && anchor){
      // Move fit button before fullscreen
      const btn = panel.querySelector(".sp-fit-btn");
      if(btn) panel.insertBefore(btn, anchor);
    }
  })();

  // ClearKey
  const key = getClearKey(record);
  if(key){
    shakaPlayer.configure({ drm: { clearKeys: { [key.keyId]: key.key } } });
    LOG("ClearKey applied:", key.keyId);
  } else {
    shakaPlayer.configure({ drm: {} });
  }

  shakaPlayer.configure(buildShakaCfg());

  // Thermal guard
  shakaSessionStart = Date.now();
  shakaThermalTimer = setInterval(() => {
    if(Date.now() - shakaSessionStart < 60 * 60 * 1000) return;
    clearInterval(shakaThermalTimer); shakaThermalTimer = null;
    if(shakaThermalApplied) return;
    shakaThermalApplied = true;
    try{
      shakaPlayer.configure("streaming.bufferBehind", 8);
      if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){
        shakaPlayer.configure("abr.restrictions.maxHeight", Math.min(PROF.maxH, 720));
      }
    }catch(_){}
  }, 60000);

  const streamInfo = { url: record.link, type: record.type };
  currentStreamInfo = streamInfo;

  // Reload logic
  async function reloadShaka(){
    if(shakaRefreshing) return;
    if(token !== playbackToken) return;
    if(!shakaPlayer) return;

    if(shakaRetries >= 5){
      toast("Stream Unavailable. Please Try Again Later.", "err", 0);
      return;
    }

    shakaRefreshing = true;
    shakaRetries++;
    toast(`Reconnecting… (${shakaRetries}/5)`, "warn", 0);

    try{
      shakaPlayer.configure(buildShakaCfg());
      await shakaPlayer.load(streamInfo.url);
      if(token !== playbackToken){ shakaRefreshing = false; return; }
      vid.play().catch(()=>{});
      shakaRetries = 0;
      toast("Live", "live", 4000);
      shakaRefreshing = false;
    }catch(err){
      LOG(`Shaka reload attempt ${shakaRetries} failed:`, err);
      const delay = Math.min(1000 * Math.pow(2, shakaRetries - 1), 8000);
      setTimeout(() => {
        shakaRefreshing = false;
        reloadShaka();
      }, delay);
    }
  }

  function goLiveEdge(){
    if(shakaRefreshing) return;
    if(token !== playbackToken) return;
    if(!shakaPlayer) return;
    try{
      shakaPlayer.goToLive();
      toast("Syncing To Live Edge…", "warn", 2000);
    }catch(_){
      reloadShaka();
    }
  }

  // Shaka errors
  const RECOVERABLE = [1001, 1002, 1003, 4012, 6006, 6007, 7000, 7001, 7002];
  shakaPlayer.addEventListener("error", (ev) => {
    if(token !== playbackToken) return;
    const err = ev.detail, code = err && err.code;

    if(code === 4014 && !shakaRestrictionsRelaxed){
      shakaRestrictionsRelaxed = true;
      shakaRefreshing = true;
      toast("Adjusting Quality…", "warn", 2000);
      shakaPlayer.configure(buildShakaCfg());
      shakaPlayer.load(streamInfo.url)
        .then(() => {
          if(token !== playbackToken) return;
          vid.play().catch(()=>{});
          shakaRetries = 0;
          toast("Live", "live", 4000);
        })
        .catch(() => { if(token === playbackToken) setTimeout(reloadShaka, 500); })
        .finally(() => { shakaRefreshing = false; });
      return;
    }

    if(RECOVERABLE.includes(code)){
      toast("Buffering…", "warn", 0);
      setTimeout(() => { if(!shakaRefreshing) reloadShaka(); }, 500);
    } else {
      const cat = {1:"Network",2:"Text",3:"Media",4:"Manifest",5:"Stream",6:"DRM",7:"Player"};
      let msg = (cat[err.category] || "Error") + " " + err.category + ":" + err.code;
      toast(msg, "err", 6000);
    }
  });

  // Video events
  vid.addEventListener("waiting", () => {
    if(shakaStallTmr) return;
    toast("Buffering…", "warn", 0);
    if(!shakaStarted || shakaRefreshing) return;
    shakaStallTmr = setTimeout(() => {
      shakaStallTmr = null;
      goLiveEdge();
    }, 5000);
  });

  vid.addEventListener("stalled", () => {
    if(!shakaStallTmr) vid.dispatchEvent(new Event("waiting"));
  });

  vid.addEventListener("playing", () => {
    shakaStarted = true;
    if(shakaStallTmr){ clearTimeout(shakaStallTmr); shakaStallTmr = null; }
    if(!shakaRefreshing) toast("Live", "live", 3000);
    showPlayerTGPopup();
  });

  vid.addEventListener("error", () => {
    if(shakaRefreshing) return;
    toast("Buffering…", "warn", 0);
    setTimeout(() => { if(!shakaRefreshing) reloadShaka(); }, 500);
  });

  // Unmute on interaction
  const unmuteOnce = () => { vid.muted = false; };
  container.addEventListener("pointerdown", unmuteOnce, {capture:true, once:true});
  container.addEventListener("click", unmuteOnce, {capture:true, once:true});
  container.addEventListener("keydown", unmuteOnce, {capture:true, once:true});

  // Wake lock
  if("wakeLock" in navigator){
    navigator.wakeLock.request("screen").catch(()=>{});
  }

  // Initial load
  try{
    toast("Loading DASH Stream…", "warn", 0);
    await shakaPlayer.load(streamInfo.url);
    if(token !== playbackToken) return;
    loadEl.hidden = true;
    toast("Ready — Tap ▶ To Play", "ok", 5000);
    vid.muted = true;
    vid.play().catch(() => LOG("Autoplay blocked"));
  }catch(e){
    ERR("Shaka initial load failed:", e);
    loadEl.hidden = true;
    toast("Connection Error — Retrying…", "warn", 0);
    setTimeout(reloadShaka, 800);
  }
}

/* ============================================================
   PLAYER DISPATCHER
   ============================================================ */
async function destroyPlayer(){
  await destroyJwPlayer();
  await destroyShakaPlayer();
}

async function stopPlayback(){
  playbackToken++;
  await destroyPlayer();
}

async function playRecord(record, index){
  if(!record) return;

  document.querySelectorAll("[data-player-stream]").forEach((btn, i) => {
    btn.classList.toggle("active", i === index);
  });

  const token = ++playbackToken;
  await destroyPlayer();

  const rawUrl = String(record.link || "").split("|")[0].trim();
  if(!/^https?:\/\//i.test(rawUrl)){
    $("player-container").innerHTML = `<div class="screen-msg">Invalid stream link.</div>`;
    return;
  }

  const isHls = record.type === "HLS" || /\.m3u8(\?|$)/i.test(rawUrl);
  const isDash = record.type === "DASH" || /\.mpd(\?|$)/i.test(rawUrl);

  try{
    if(isHls){
      LOG("Playing HLS via JW Player:", rawUrl);
      mountJwPlayer({...record, link: rawUrl}, token);
    } else if(isDash){
      LOG("Playing DASH via Shaka Player:", rawUrl);
      await mountShakaPlayer({...record, link: rawUrl}, token);
    } else {
      $("player-container").innerHTML = `<div class="screen-msg">Unsupported stream format.</div>`;
    }
  }catch(error){
    if(token === playbackToken){
      $("player-container").innerHTML =
        `<div class="screen-msg">Could not play this stream.<small>${esc(error.message || "")}</small></div>`;
      ERR("Playback error:", error);
    }
  }
}

function renderPlayerStreams(activeIndex){
  const box = $("streams");
  if(!state.currentStreams.length){
    box.innerHTML = `<div class="state" style="padding:40px 20px"><p>No streams were found for this event.</p></div>`;
    return;
  }
  box.innerHTML = state.currentStreams.map((s, i) =>
    `<button class="stream-btn ${i === activeIndex ? "active" : ""}"
             data-player-stream="${i}" type="button">
       <span class="title">${esc(s.title)}</span>
       <span class="tags">
         <span class="type-badge ${s.type.toLowerCase()}">${esc(s.type)}</span>
       </span>
     </button>`
  ).join("");
}

/* ============================================================
   ROTATION HANDLING
   ============================================================ */
function onViewportChange(){
  if(shakaOverlay && shakaOverlay.getControls){
    try{ shakaOverlay.getControls().dispatchEvent(new Event("resize")); }catch(_){}
  }
  if(jwInstance){
    try{
      const vid = jwInstance.getContainer().querySelector("video");
      if(vid) vid.dispatchEvent(new Event("resize"));
    }catch(_){}
  }
}

let rotationAttached = false;
function setupRotation(){
  if(rotationAttached) return;
  rotationAttached = true;
  window.addEventListener("resize", onViewportChange, {passive:true});
  window.addEventListener("orientationchange", () => {
    setTimeout(onViewportChange, 200);
    setTimeout(onViewportChange, 450);
  });
  document.addEventListener("fullscreenchange", () => {
    if(document.fullscreenElement){
      if(screen.orientation && screen.orientation.lock){
        screen.orientation.lock("landscape").catch(()=>{});
      }
    } else {
      if(screen.orientation && screen.orientation.unlock){
        try{ screen.orientation.unlock(); }catch(_){}
      }
    }
    setTimeout(onViewportChange, 120);
  });
}

$("list").addEventListener("click", e => {

  if(!card) return;
  location.hash = `#watch?id=${encodeURIComponent(card.dataset.watchEvent)}&stream=0`;
});

$("sports").addEventListener("click", e => {
  const btn = e.target.closest("[data-sport]");
  if(!btn) return;
  state.sport = btn.dataset.sport;
  renderHub();
});

$("tabs").addEventListener("click", e => {
  const btn = e.target.closest("[data-tab]");
  if(!btn) return;
  state.tab = btn.dataset.tab;
  renderHub();
});

$("streams").addEventListener("click", e => {
  const btn = e.target.closest("[data-player-stream]");
  if(!btn || !state.currentEvent) return;
  const index = Number(btn.dataset.playerStream);
  if(!state.currentStreams[index]) return;
  state.currentIndex = index;
  history.replaceState(null, "",
    `#watch?id=${encodeURIComponent(state.currentEvent.id)}&stream=${index}`);
  playRecord(state.currentStreams[index], index);
});
