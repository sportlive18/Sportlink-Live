<html lang="en">
<head>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  width:100%;min-height:100vh;min-height:100dvh;
  background-color:#08080c;
  background-image:radial-gradient(ellipse at 50% 0%,rgba(255,184,0,.12) 0%,transparent 60%),radial-gradient(ellipse at 100% 100%,rgba(255,136,0,.06) 0%,transparent 50%),url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  overflow-x:hidden;overflow-y:auto;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
  color:#fff
}
#overlay{
  position:fixed;inset:0;z-index:9999;
  background:radial-gradient(ellipse at 50% 30%,#1a1205 0%,#08080c 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center
}
.loader-wrap{
  position:relative;width:80px;height:80px;
  display:flex;align-items:center;justify-content:center
}
.loader-ring{
  position:absolute;inset:0;border-radius:50%;
  border:4px solid transparent;
  border-top-color:#ffb800;
  border-right-color:rgba(255,184,0,.05);
  animation:spin 1.2s cubic-bezier(.55,.1,.45,.9) infinite
}
.loader-ring-inner{
  position:absolute;inset:14px;border-radius:50%;
  border:4px solid transparent;
  border-bottom-color:#ff8800;
  border-left-color:rgba(255,136,0,.05);
  animation:spin-rev 1s cubic-bezier(.55,.1,.45,.9) infinite
}
.loader-core{
  width:14px;height:14px;border-radius:50%;
  background:#ffb800;
  box-shadow:0 0 20px #ffb800,0 0 40px rgba(255,184,0,.4);
  animation:pulse-core 1.5s ease-in-out infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spin-rev{to{transform:rotate(-360deg)}}
@keyframes pulse-core{0%,100%{transform:scale(.8);opacity:.6}50%{transform:scale(1.2);opacity:1}}
#video-loading{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  z-index:9;opacity:0;pointer-events:none;transition:opacity .2s;
  background:rgba(0,0,0,.6)
}
#video-loading.on{opacity:1}
.video-spinner{
  width:56px;height:56px;
  border:4px solid rgba(255,184,0,.12);
  border-top-color:#ffb800;
  border-radius:50%;
  animation:spin .8s linear infinite
}
#channel-list{
  position:relative;width:100%;min-height:100vh;
  display:none;flex-direction:column;
  padding:0 0 40px 0;z-index:1
}
.header{
  padding:32px 16px 24px;
  text-align:center;
}
.header h1{
  font-size:30px;font-weight:900;letter-spacing:.5px;
  background:linear-gradient(135deg,#ffb800,#ff8800);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:8px;
  text-transform:uppercase;
  filter:drop-shadow(0 2px 12px rgba(255,136,0,.35))
}
.header p{
  font-size:14px;color:#8e8e9a;font-weight:500;
  max-width:400px;margin:0 auto;
  line-height:1.5
}
.filters{
  display:flex;align-items:center;justify-content:center;
  gap:10px;padding:0 16px 24px;
  flex-wrap:wrap;
}
.filter-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 22px;border-radius:30px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  color:#b0b0bc;font-size:13px;font-weight:700;
  cursor:pointer;transition:all .25s ease;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
.filter-btn.active{
  background:linear-gradient(135deg,#ffb800,#ff8800);
  color:#0a0a0f;border-color:transparent;
  box-shadow:0 4px 20px rgba(255,136,0,.4)
}
.filter-btn svg{
  width:16px;height:16px;fill:currentColor
}
#ch-cards{
  display:flex;flex-direction:column;gap:20px;
  padding:0 16px;width:100%;max-width:480px;margin:0 auto
}
.match-card{
  background:linear-gradient(168deg,#1a1a22 0%,#111116 100%);
  border:1px solid rgba(255,184,0,.1);
  border-radius:18px;overflow:hidden;
  box-shadow:0 8px 40px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.04);
  display:flex;flex-direction:column;
  transition:transform .2s ease,border-color .3s ease
}
.match-card:active{transform:scale(.98)}
.match-card:hover{border-color:rgba(255,184,0,.3)}
.card-poster{
  position:relative;width:100%;
  background:#0d0d1c;overflow:hidden
}
.card-poster img{
  width:100%;aspect-ratio:16/9;
  object-fit:cover;display:block;
}
.card-poster::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to bottom,transparent 60%,rgba(10,10,15,.95) 100%);
  pointer-events:none
}
.ribbon-clip{
  position:absolute;top:0;right:0;
  width:120px;height:120px;overflow:hidden;pointer-events:none;z-index:5
}
.ribbon{
  position:absolute;top:30px;right:-35px;
  width:150px;text-align:center;
  transform:rotate(45deg);
  font-size:11px;font-weight:900;letter-spacing:2px;
  padding:8px 0;
  display:flex;align-items:center;justify-content:center;gap:6px;
  text-transform:uppercase
}
.ribbon.live{
  background:linear-gradient(135deg,#e82000,#ff4422);
  color:#fff;
  box-shadow:0 4px 15px rgba(232,32,0,.5)
}
.ribbon.upcoming{
  background:linear-gradient(135deg,#1e1e2e,#2a2a3e);
  color:#a0a0b0;
  border-top:1px solid rgba(255,255,255,.15);
  border-bottom:1px solid rgba(255,255,255,.15)
}
.ribbon-dot{
  width:6px;height:6px;border-radius:50%;
  background:#fff;flex-shrink:0;
  animation:pulse-dot 1s ease-in-out infinite
}
.ribbon.upcoming .ribbon-dot{display:none}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.6)}}
.card-info{
  padding:18px;
  display:flex;flex-direction:column;gap:14px;
  position:relative;z-index:1;
  margin-top:-30px;
}
.card-title{
  font-size:17px;font-weight:800;
  color:#fff;line-height:1.4;
  text-shadow:0 2px 8px rgba(0,0,0,.8)
}
.card-subtitle{
  font-size:13px;font-weight:600;
  color:#ffb800;line-height:1.4
}
.card-meta{
  display:flex;align-items:center;gap:14px;
  font-size:12px;font-weight:600;
  color:#8e8e9a
}
.card-meta span{
  display:flex;align-items:center;gap:5px
}
.card-meta svg{
  width:14px;height:14px;fill:currentColor
}
.streams-section{
  display:flex;flex-direction:column;gap:10px;
  padding-top:6px;border-top:1px solid rgba(255,255,255,.06)
}
.streams-btns{
  display:flex;gap:8px;flex-wrap:wrap
}
.stream-btn{
  flex:1;min-width:90px;
  display:inline-flex;align-items:center;justify-content:center;
  padding:12px 10px;border-radius:10px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  color:#e0e0ea;font-size:12px;font-weight:700;
  text-decoration:none;text-align:center;
  transition:all .25s ease;
  -webkit-tap-highlight-color:transparent;
  letter-spacing:.3px
}
.stream-btn:active{
  background:rgba(255,184,0,.15);
  border-color:rgba(255,184,0,.5);
  color:#ffb800;
  transform:scale(.96)
}
.stream-btn[data-server="1"]:active{background:rgba(59,130,246,.15);border-color:rgba(59,130,246,.5);color:#60a5fa}
.stream-btn[data-server="3"]:active{background:rgba(168,85,247,.15);border-color:rgba(168,85,247,.5);color:#c084fc}
.stream-btn[data-server="7"]:active{background:rgba(255,184,0,.15);border-color:rgba(255,184,0,.5);color:#ffb800}
.upcoming-btn{
  width:100%;
  display:inline-flex;align-items:center;justify-content:center;
  padding:16px;border-radius:12px;
  background:linear-gradient(180deg,rgba(40,40,55,1),rgba(25,25,35,1));
  border:1px solid rgba(255,184,0,.2);
  color:#ffb800;font-size:14px;font-weight:900;
  cursor:pointer;transition:all .25s ease;
  text-transform:uppercase;letter-spacing:1.5px;
  -webkit-tap-highlight-color:transparent;
  box-shadow:0 4px 20px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1);
  position:relative;overflow:hidden
}
.upcoming-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,184,0,.1),transparent);
  transform:translateX(-100%);
  transition:transform .6s ease
}
.upcoming-btn:active::before{transform:translateX(100%)}
.upcoming-btn:active{
  transform:scale(.97);
  border-color:rgba(255,184,0,.5);
  box-shadow:0 2px 10px rgba(255,184,0,.2)
}
#pc{
  position:fixed;inset:0;background:#000;
  display:none;align-items:center;justify-content:center;
  touch-action:manipulation;z-index:999
}
video{width:100%;height:100%;object-fit:contain;background:#000}
video.mode-fill{object-fit:fill}
video.mode-cover{object-fit:cover}
#status{
  position:fixed;
  top:max(14px,env(safe-area-inset-top));
  right:14px;z-index:9997;
  display:flex;align-items:center;gap:7px;
  padding:6px 14px 6px 10px;
  background:rgba(9,9,18,.95);
  border:1px solid rgba(255,255,255,.08);
  font-size:11.5px;font-weight:700;letter-spacing:.2px;
  border-radius:24px;pointer-events:none;
  opacity:0;transform:translateY(-8px);
  transition:opacity .24s,transform .24s;
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;
  box-shadow:0 4px 24px rgba(0,0,0,.6)
}
#status.show{opacity:1;transform:translateY(0)}
.st-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
#status.ok   .st-dot{background:#60a5fa}
#status.live .st-dot{background:#22d3a0;animation:pulse-dot 2s ease-in-out infinite}
#status.warn .st-dot{background:#fb923c;animation:pulse-dot 1s ease-in-out infinite}
#status.err  .st-dot{background:#f87171}
#status.ok  {color:#c0c0cc}
#status.live{color:#c8c8d4}
#status.warn{color:#fcd34d}
#status.err {color:#fca5a5}
.sp-btn{
  background:transparent!important;border:none!important;
  cursor:pointer!important;padding:0 8px!important;
  opacity:.75;display:flex;align-items:center;justify-content:center;
  height:100%;min-width:36px;
  transition:opacity .14s;color:#fff!important;
  -webkit-tap-highlight-color:transparent
}
.sp-btn:hover{opacity:1}
.sp-btn:active{opacity:1;transform:scale(.9)}
.sp-fit-btn{padding:0 7px!important;min-width:auto!important}
.fit-pill{
  font-size:10px;font-weight:800;letter-spacing:.4px;
  padding:3px 7px;border-radius:4px;line-height:1;
  border:1.5px solid rgba(255,255,255,.28);
  color:rgba(255,255,255,.8);
  pointer-events:none;white-space:nowrap
}
.sp-fit-btn.mode-fill  .fit-pill{border-color:#FFB800;color:#FFB800}
.sp-fit-btn.mode-cover .fit-pill{border-color:#a78bfa;color:#a78bfa}
.shaka-spinner-container,.shaka-spinner,.shaka-spinner-svg{display:none!important}
.shaka-controls-container button{color:#fff!important}
.shaka-video-container{background-color:#000!important}
@media(max-width:360px){
  #ch-cards{padding:0 10px}
  .header h1{font-size:24px}
  .stream-btn{font-size:11px;padding:10px 6px;min-width:80px}
  .filter-btn{padding:8px 16px;font-size:12px}
  .card-info{padding:14px}
}
</style>
</head>
<body>
<div id="overlay">
  <div class="loader-wrap">
    <div class="loader-ring"></div>
    <div class="loader-ring-inner"></div>
    <div class="loader-core"></div>
  </div>
</div>
<div id="channel-list">
  <div class="header">
    <h1>USA Cricbuzz</h1>
    <p>Stream Exclusive Sports &amp; Live Matches in 4K</p>
  </div>
  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">
      <svg viewBox="0 0 24 24"><path d="M4 4h7v7H4V4zm9 0h7v7h-7V4zM4 13h7v7H4v-7zm9 0h7v7h-7v-7z"/></svg>
      All
    </button>
    <button class="filter-btn" data-filter="live">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
      Live Now
    </button>
    <button class="filter-btn" data-filter="upcoming">
      <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
      Upcoming
    </button>
  </div>
  <div id="ch-cards"></div>
</div>
<div id="pc">
  <video id="v" playsinline webkit-playsinline preload="none" x5-video-player-type="h5" x5-video-player-fullscreen="true"></video>
  <div id="video-loading"><div class="video-spinner"></div></div>
</div>
<div id="status"></div>
<script src="https://cdn.jsdelivr.net/npm/shaka-player@5.2.9/dist/shaka-player.ui.min.js"></script>
<script>
(function(){
"use strict";
var API_1 = "https://sonujson-v4.pages.dev/Data/willow.json";
var API_2 = "https://sonujson-v4.pages.dev/Data/prime.json";
var FETCH_TIMEOUT = 10000;
var RETRY_DELAY = 12000;
var SERVER_MAP = [
  { id: 1, key: "fastly_server1", label: "Live Now" },
  { id: 3, key: "akamai_server1", label: "Ada Fee" },
  { id: 7, key: "akamai_server2", label: "ULTRQ HD 4K" }
];
var FITS = ["contain","fill","cover"];
var FIT_LABELS = {contain:"Fit",fill:"Fill",cover:"Zoom"};
var $overlay = document.getElementById("overlay");
var $status = document.getElementById("status");
var $list = document.getElementById("channel-list");
var $cards = document.getElementById("ch-cards");
var $pc = document.getElementById("pc");
var $vid = document.getElementById("v");
var _stTmr = null;
var _channels = [];
var _currentFilter = "all";

function toast(msg, type, dur){
  $status.innerHTML = '<span class="st-dot"></span><span>' + msg + '</span>';
  $status.className = "show " + (type || "ok");
  if(_stTmr){ clearTimeout(_stTmr); _stTmr = null; }
  if(dur !== 0){
    _stTmr = setTimeout(function(){
      $status.className = $status.className.replace("show","").trim();
      _stTmr = null;
    }, dur !== undefined ? dur : 4000);
  }
}

function hideOverlay(){
  if(!$overlay || $overlay.style.display === "none") return;
  $overlay.style.transition = "opacity .4s ease";
  $overlay.style.opacity = "0";
  setTimeout(function(){ $overlay.style.display = "none"; }, 420);
}

function getStreamInfo(){
  var s = location.search;
  if(s.length < 2) return {id:null, srv:1};
  var parts = s.slice(1).split("&");
  var first = parts[0];
  var eq = first.indexOf("=");
  var id = (eq !== -1 ? first.slice(eq + 1) : first).trim();
  try{ id = decodeURIComponent(id); }catch(e){}
  var srv = 1;
  for(var i = 1; i < parts.length; i++){
    var kv = parts[i].split("=");
    if((kv[0] === "ser" || kv[0] === "server") && kv[1] !== undefined){
      srv = parseInt(kv[1], 10) || 1;
    }
  }
  if(!id || !id.startsWith("CB")) return {id:null, srv:1};
  return {id: id, srv: Math.max(1, Math.min(srv, 8))};
}

function fetchJSON(url){
  var ctrl = new AbortController();
  var tmr = setTimeout(function(){ ctrl.abort(); }, FETCH_TIMEOUT);
  var sep = url.indexOf("?") === -1 ? "?" : "&";
  return fetch(url + sep + "_=" + Date.now(), {cache:"no-store", signal:ctrl.signal})
    .then(function(r){
      clearTimeout(tmr);
      if(!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .catch(function(e){ clearTimeout(tmr); throw e; });
}

function extractList(data){
  if(Array.isArray(data)) return data;
  if(data && Array.isArray(data.Matches)) return data.Matches;
  if(data && Array.isArray(data.matches)) return data.matches;
  if(data && Array.isArray(data.channels)) return data.channels;
  if(data && Array.isArray(data.events)) return data.events;
  if(data && Array.isArray(data.streams)) return data.streams;
  return [];
}

function loadChannels(){
  return Promise.allSettled([fetchJSON(API_1), fetchJSON(API_2)])
    .then(function(results){
      var seen = {}, merged = [];
      results.forEach(function(r){
        if(r.status !== "fulfilled") return;
        extractList(r.value).forEach(function(ch){
          var id = String(ch.id || "").trim();
          if(id && !seen[id]){ seen[id] = true; merged.push(ch); }
        });
      });
      return merged;
    });
}

function parseDrm(drmKey){
  var p = String(drmKey || "").split(":");
  if(p.length < 2) return null;
  return {keyId: p[0].trim(), key: p[1].trim()};
}

function getAvailableServers(ch){
  var cnp = ch.CnpTV || {};
  return SERVER_MAP.filter(function(s){
    return !!cnp[s.key];
  });
}

function getTier(){
  var mem = navigator.deviceMemory || 4;
  var cores = navigator.hardwareConcurrency || 4;
  var mob = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  var net = (navigator.connection || {}).effectiveType || "4g";
  if(!mob) return "high";
  if(mem <= 1.5 || cores <= 2 || net === "slow-2g" || net === "2g") return "low";
  if(mem <= 3 || cores <= 4) return "mid";
  return "high";
}

var PROF = {
  low:  {buf:4,  reBuf:1.5, behind:10, bwEst:400000},
  mid:  {buf:7,  reBuf:1.5, behind:20, bwEst:1000000},
  high: {buf:10, reBuf:2,   behind:25, bwEst:2000000}
}[getTier()];

function ratioLabel(w, h){
  if(!w || !h) return "\u2014";
  function gcd(a, b){ return b ? gcd(b, a % b) : a; }
  var named = {"16:9":16/9,"4:3":4/3,"21:9":21/9,"1:1":1,"9:16":9/16,"3:2":3/2,"5:4":5/4,"2:1":2};
  var real = w / h, best = null, bestD = .02;
  Object.keys(named).forEach(function(k){
    var d = Math.abs(named[k] - real);
    if(d < bestD){ bestD = d; best = k; }
  });
  if(best) return best;
  var g = gcd(w, h) || 1, rw = w/g, rh = h/g;
  return (rw <= 40 && rh <= 40) ? rw + ":" + rh : real.toFixed(2) + ":1";
}

function injectFitBtn(container, vid){
  var panel = container.querySelector(".shaka-controls-button-panel");
  if(!panel) return false;
  var anchor = panel.querySelector(".shaka-fullscreen-button");
  var fitIdx = 0;
  var curRatio = "\u2014";
  var btn = document.createElement("button");
  btn.className = "sp-btn sp-fit-btn";
  btn.title = "Video Fit";
  btn.setAttribute("aria-label","Cycle Video Fit Mode");
  btn.innerHTML = '<span class="fit-pill">\u2014</span>';
  if(anchor) panel.insertBefore(btn, anchor);
  else panel.appendChild(btn);

  function applyFit(i){
    fitIdx = i;
    var m = FITS[i];
    vid.classList.remove("mode-fill","mode-cover");
    if(m === "fill")  vid.classList.add("mode-fill");
    if(m === "cover") vid.classList.add("mode-cover");
    btn.classList.remove("mode-fill","mode-cover");
    if(m !== "contain") btn.classList.add("mode-" + m);
    btn.title = "Video Fit: " + FIT_LABELS[m];
    var pill = btn.querySelector(".fit-pill");
    if(pill) pill.textContent = (m === "contain") ? curRatio : FIT_LABELS[m];
  }

  btn.addEventListener("click", function(e){
    e.stopPropagation();
    applyFit((fitIdx + 1) % FITS.length);
  });
  ["fullscreenchange","webkitfullscreenchange"].forEach(function(ev){
    document.addEventListener(ev, function(){
      if(!(document.fullscreenElement || document.webkitFullscreenElement)) applyFit(0);
    });
  });

  var _tries = 0;
  function updateRatio(){
    var pill = btn.querySelector(".fit-pill");
    if(!pill) return;
    if(vid.videoWidth > 0){
      curRatio = ratioLabel(vid.videoWidth, vid.videoHeight);
      if(FITS[fitIdx] === "contain") pill.textContent = curRatio;
      _tries = 0;
    } else if(_tries < 15){
      _tries++;
      setTimeout(updateRatio, 700);
    }
  }
  vid.addEventListener("loadedmetadata", function(){ _tries = 0; updateRatio(); });
  vid.addEventListener("resize", updateRatio);
  vid.addEventListener("timeupdate", function onFirst(){ vid.removeEventListener("timeupdate", onFirst); updateRatio(); });
  updateRatio();
  return true;
}

function renderLanding(channels){
  $cards.innerHTML = "";
  var filtered = channels.filter(function(ch){
    if(_currentFilter === "all") return true;
    var isLive = String(ch.status || "").toUpperCase() === "LIVE";
    if(_currentFilter === "live") return isLive;
    if(_currentFilter === "upcoming") return !isLive;
    return true;
  });

  if(filtered.length === 0){
    $cards.innerHTML = '<div style="text-align:center;padding:60px 0;color:#5a5a6a;font-size:14px;font-weight:700;letter-spacing:1px;">NO EVENTS FOUND FOR THIS FILTER</div>';
    hideOverlay();
    return;
  }

  var frag = document.createDocumentFragment();

  filtered.forEach(function(ch){
    var id = String(ch.id || "").trim();
    if(!id) return;
    var isLive = String(ch.status || "").toUpperCase() === "LIVE";
    var srvs = getAvailableServers(ch);

    var card = document.createElement("div");
    card.className = "match-card";

    var posterWrap = document.createElement("div");
    posterWrap.className = "card-poster";

    var img = document.createElement("img");
    img.src = ch.image || "";
    img.alt = ch.event_name || "";
    img.loading = "lazy";
    img.decoding = "async";

    var ribbonClip = document.createElement("div");
    ribbonClip.className = "ribbon-clip";

    var ribbon = document.createElement("div");
    ribbon.className = "ribbon " + (isLive ? "live" : "upcoming");

    if(isLive){
      var rdot = document.createElement("span");
      rdot.className = "ribbon-dot";
      ribbon.appendChild(rdot);
    }
    ribbon.appendChild(document.createTextNode(isLive ? "LIVE" : "UPCOMING"));
    ribbonClip.appendChild(ribbon);

    posterWrap.appendChild(img);
    posterWrap.appendChild(ribbonClip);

    var info = document.createElement("div");
    info.className = "card-info";

    var titleEl = document.createElement("div");
    titleEl.className = "card-title";
    titleEl.textContent = ch.event_name || id;

    var subtitleEl = document.createElement("div");
    subtitleEl.className = "card-subtitle";
    subtitleEl.textContent = ch.series || ch.tournament || "";

    var metaRow = document.createElement("div");
    metaRow.className = "card-meta";

    if(ch.time){
      var timeSpan = document.createElement("span");
      timeSpan.innerHTML = '<svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>';
      timeSpan.appendChild(document.createTextNode(ch.time));
      metaRow.appendChild(timeSpan);
    }

    if(ch.sport){
      var sportSpan = document.createElement("span");
      sportSpan.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>';
      sportSpan.appendChild(document.createTextNode(ch.sport));
      metaRow.appendChild(sportSpan);
    }

    info.appendChild(titleEl);
    if(subtitleEl.textContent) info.appendChild(subtitleEl);
    info.appendChild(metaRow);

    if(srvs.length > 0){
      var streamsSection = document.createElement("div");
      streamsSection.className = "streams-section";
      var btnsWrap = document.createElement("div");
      btnsWrap.className = "streams-btns";

      srvs.forEach(function(s) {
        var a = document.createElement("a");
        a.className = "stream-btn";
        a.href = "?CB" + id.replace(/[^0-9]/g, "") + "&ser=" + s.id;
        a.setAttribute("data-server", s.id);
        a.textContent = s.label;
        btnsWrap.appendChild(a);
      });
      streamsSection.appendChild(btnsWrap);
      info.appendChild(streamsSection);
    } else {
      var upcomingBtn = document.createElement("button");
      upcomingBtn.className = "upcoming-btn";
      upcomingBtn.type = "button";
      upcomingBtn.textContent = "UPCOMING";
      upcomingBtn.addEventListener("click", function(){
        var details = "MATCH DETAILS\n\n";
        details += "EVENT: " + (ch.event_name || "N/A").toUpperCase() + "\n";
        if(ch.series || ch.tournament) details += "SERIES: " + (ch.series || ch.tournament).toUpperCase() + "\n";
        if(ch.sport) details += "SPORT: " + ch.sport.toUpperCase() + "\n";
        if(ch.time) details += "TIME: " + ch.time.toUpperCase() + "\n";
        details += "STATUS: UPCOMING";
        alert(details);
      });
      info.appendChild(upcomingBtn);
    }

    card.appendChild(posterWrap);
    card.appendChild(info);
    frag.appendChild(card);
  });

  $cards.appendChild(frag);
  $list.style.display = "flex";
  hideOverlay();
}

function startPlayer(ch, srvNum){
  $list.style.display = "none";
  $pc.style.display = "flex";
  shaka.polyfill.installAll();
  if(!shaka.Player.isBrowserSupported()){
    hideOverlay();
    toast("Browser Not Supported", "err", 0);
    return;
  }

  var player = new shaka.Player();
  var drm = parseDrm(ch.drm_key);
  var started = false;

  function resolveUrl(){
    var cnp = ch.CnpTV || {};
    var target = SERVER_MAP.find(function(s) { return s.id === srvNum; });
    if (target && cnp[target.key]) return cnp[target.key];
    var available = SERVER_MAP.filter(function(s) { return !!cnp[s.key]; });
    return available.length > 0 ? cnp[available[0].key] : null;
  }

  player.attach($vid).then(function(){
    new shaka.ui.Overlay(player, $pc, $vid).configure({
      controlPanelElements:["play_pause","mute","volume","spacer","time_and_duration","spacer","quality","captions","picture_in_picture","fullscreen"],
      seekBarColors:{base:"#828282",buffered:"#ffc336",played:"#1fc7ff"}
    });

    var $loader = document.getElementById("video-loading");
    var lPlaying = false;
    function showVidLoader(){ if(lPlaying) $loader.classList.add("on"); }
    function hideVidLoader(){ lPlaying = true; $loader.classList.remove("on"); }
    $vid.addEventListener("waiting", showVidLoader);
    $vid.addEventListener("stalled", showVidLoader);
    $vid.addEventListener("seeking", showVidLoader);
    $vid.addEventListener("canplay", hideVidLoader);
    $vid.addEventListener("timeupdate", function(){ if(!$vid.paused && $vid.currentTime > 0) hideVidLoader(); });

    var _injectN = 0;
    (function tryInject(){
      if(injectFitBtn($pc, $vid)) return;
      if(++_injectN < 5) setTimeout(tryInject, 150);
    })();

    player.getNetworkingEngine().registerRequestFilter(function(type, req){
      req.headers["Referer"] = "https://www.amazon.com/gp/";
      req.headers["User-Agent"] = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Safari/537.36";
    });

    $vid.muted = true;
    (function(){
      function doUnmute(){ $vid.muted = false; }
      $pc.addEventListener("pointerdown", doUnmute, {capture:true, once:true});
      $pc.addEventListener("click", doUnmute, {capture:true, once:true});
    })();

    function buildCfg(){
      var cfg = {
        manifest:{
          defaultPresentationDelay:4,
          ignoreTextStreamFailures:true,
          dash:{autoCorrectDrift:true, ignoreMinBufferTime:true},
          retryParameters:{baseDelay:100}
        },
        abr:{
          enabled:true,
          defaultBandwidthEstimate:PROF.bwEst,
          bandwidthUpgradeTarget:.85,
          bandwidthDowngradeTarget:.95,
          restrictions:{maxHeight:1080}
        }
      };
      if(drm) cfg.drm = {clearKeys:{[drm.keyId]:drm.key}, retryParameters:{baseDelay:100}};
      return cfg;
    }

    function applyStreamingCfg(){
      player.configurationForLowLatency({
        streaming:{
          inaccurateManifestTolerance:0,
          segmentPrefetchLimit:2,
          updateIntervalSeconds:.1,
          maxDisabledTime:1,
          bufferingGoal:PROF.buf,
          rebufferingGoal:PROF.reBuf,
          bufferBehind:PROF.behind,
          safeSeekOffset:3,
          retryParameters:{baseDelay:100, maxAttempts:5, backoffFactor:1.5, fuzzFactor:.5}
        },
        manifest:{dash:{autoCorrectDrift:true}, retryParameters:{baseDelay:100}},
        drm:{retryParameters:{baseDelay:100}}
      });
    }

    function load(){
      var url = resolveUrl();
      if(!url){ toast("Connecting...", "warn", 0); return; }
      toast("Connecting...", "warn", 0);
      player.configure(buildCfg());
      applyStreamingCfg();
      player.load(url).then(function(){
        $vid.play().catch(function(){});
      }).catch(function(e){
        console.error("Load failed:", e && e.code, e && e.message);
        toast("Reconnecting...", "warn", 0);
        setTimeout(load, RETRY_DELAY);
      });
    }

    player.addEventListener("error", function(ev){
      var err = ev.detail;
      if(err && err.severity === shaka.util.Error.Severity.RECOVERABLE) return;
      console.error("Shaka error:", err && err.code, err && err.message);
      toast("Reconnecting...", "warn", 0);
      setTimeout(load, RETRY_DELAY);
    });

    $vid.addEventListener("playing", function(){
      started = true;
      hideVidLoader();
      toast("Live", "live", 3000);
    });

    document.addEventListener("visibilitychange", function(){
      if(!document.hidden) setTimeout(function(){
        if(started && $vid.paused) $vid.play().catch(function(){});
      }, 400);
    });

    document.addEventListener("fullscreenchange", onFSChange);
    document.addEventListener("webkitfullscreenchange", onFSChange);
    function onFSChange(){
      var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
      if(fsEl && screen.orientation && screen.orientation.lock){
        screen.orientation.lock("landscape").catch(function(){});
      } else if(!fsEl && screen.orientation && screen.orientation.unlock){
        try{ screen.orientation.unlock(); }catch(e){}
      }
    }

    hideOverlay();
    load();
  });
}

document.getElementById("filters").addEventListener("click", function(e){
  var btn = e.target.closest(".filter-btn");
  if(!btn) return;
  document.querySelectorAll(".filter-btn").forEach(function(b){ b.classList.remove("active"); });
  btn.classList.add("active");
  _currentFilter = btn.getAttribute("data-filter");
  renderLanding(_channels);
});

function main(){
  var info = getStreamInfo();

  loadChannels().then(function(channels){
    _channels = channels;
    if(!info.id){
      renderLanding(channels);
      return;
    }

    var id = info.id;
    var cleanId = id.replace(/[^0-9]/g, "");
    var ch = channels.find(function(c){ return String(c.id || "").trim().replace(/[^0-9]/g, "") === cleanId; });

    if(!ch){
      hideOverlay();
      toast("Stream Not Found: " + id, "err", 0);
      return;
    }

    document.title = "CnpTV \u2014 " + id;
    startPlayer(ch, info.srv);
  }).catch(function(e){
    hideOverlay();
    toast("Connection Error \u2014 Refresh to retry", "err", 0);
    console.error("API load failed:", e);
  });
}

if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", main);
} else {
  main();
}

})();
</script>
