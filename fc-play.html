<!DOCTYPE html>
<html lang="en">

    <!-- HLS.js (primary engine for .ts segment streams) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <!-- Shaka Player v4.16.2 (UI + DRM fallback) -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: #000; overflow: hidden;
            font-family: 'Poppins', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .shaka-video-container {
            position: fixed; inset: 0; background: #000;
            display: flex; align-items: center; justify-content: center;
        }

        video {
            width: 100%; height: 100%;
            object-fit: contain; background: #000;
        }

        .custom-watermark {
            position: absolute; z-index: 40; pointer-events: none;
            bottom: 80px; right: 20px;
            font-size: 11px; font-weight: 600;
            color: rgba(255,255,255,0.10);
            letter-spacing: 0.5px; text-transform: uppercase;

        .loading-overlay {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column;
            background: #000; color: #fff;
            z-index: 2000; font-size: 18px; pointer-events: none;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,.15);
            border-top: 4px solid #3b82f6;
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 1s linear infinite; margin-bottom: 12px;

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* ---- Shaka UI overrides ---- */
        .shaka-controls-container { background: transparent !important; box-shadow: none !important; filter: none !important; }
        .shaka-bottom-controls { padding: 10px 16px; display: flex !important; flex-direction: column !important; box-shadow: none !important; filter: none !important; }

        .shaka-seek-bar-container {
            display: block !important; width: 100% !important; height: 8px !important;

            width: 100% !important; height: 8px !important;

            width: 100% !important; height: 8px !important; border-radius: 50px;

        .shaka-controls-container button,

            padding: 8px 14px; border-radius: 7px; font-size: 13px; font-weight: 600;

        .hls-q-item.active::after { content: '✓'; font-size: 12px; }

        /* Error overlay */
        #error-overlay {
            position: absolute; inset: 0; z-index: 3000;
            background: rgba(0,0,0,0.88); display: none;
            align-items: center; justify-content: center; flex-direction: column; gap: 14px;
        }
        #error-overlay.show { display: flex; }
        #error-overlay p { color: rgba(255,255,255,0.75); font-size: 14px; font-weight: 500; }
        #error-retry {
            padding: 9px 24px; border-radius: 9px;
            background: #3b82f6; color: #fff; border: none;
            font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit;
        }

        /* Telegram popup — hidden */
        #telegramModal, .modal, .modal-content, #joinButton, #closeButton, .btn {
            display: none !important; visibility: hidden !important; opacity: 0 !important;
            pointer-events: none !important; width: 0 !important; height: 0 !important;
            overflow: hidden !important; position: absolute !important;
            z-index: -9999 !important; border: 0 !important; padding: 0 !important; margin: 0 !important;
        }

        @media (max-width: 700px) {
            .custom-watermark { font-size: 9px; bottom: 70px; right: 14px; }
            .shaka-seek-bar-container { height: 6px !important; }
            .shaka-seek-bar { height: 6px !important; }
            .shaka-seek-bar .shaka-range-element::-webkit-slider-thumb { width: 14px; height: 14px; }
        }
    </style>
</head>
<body>

<div class="shaka-video-container" id="player-container">

<div id="telegramModal" class="modal hidden"></div>

<script>
(function () {
    'use strict';

    /* ===================== CONFIG ===================== */
    var params      = new URLSearchParams(window.location.search);
    var STREAM_URL  = params.get('url') || params.get('play') || '';
    if (!STREAM_URL) {
        // hardcoded fallback
        STREAM_URL = "https://in-mc-flive.fancode.com/mumbai/4248054_english_hls_03789dd60351500_1ta-di_h264/1080p.m3u8?hdntl=Expires=1786008364~_GO=Generated~acl=/mumbai/4248054_english_hls_03789dd60351500_1ta-di_h264/*~Signature=AYCJ36RBkKa9suXDt3v_dBrYV76a2_n2HGxw1ulUTe4iL7cevkpSQZHJeuXe8-hAxt2OfXJ1dFiK-ZmcUoyQm8od_W0D";
    }

    /* Proxy pool — tried in order on network failures */
    var PROXIES = [
        'https://stream-through-spark.lovable.app/api/proxy?u=',
        'https://asp1.lovable.app/api/proxy?u='
    ];

    /* ===================== DOM ===================== */
    var video        = document.getElementById('video');
    var container    = document.getElementById('player-container');
    var loadingEl    = document.getElementById('loading');
    var errOverlay   = document.getElementById('error-overlay');
    var errMsg       = document.getElementById('error-msg');
    var errRetry     = document.getElementById('error-retry');
    var hlsQBtn      = document.getElementById('hls-quality-btn');
    var hlsQMenu     = document.getElementById('hls-quality-menu');

    /* ===================== STATE ===================== */
    var hlsInst       = null;
    var shakaPlayer   = null;
    var shakaUI       = null;
    var currentProxyIdx = 0;
    var streamGen     = 0;      // guards stale callbacks after reload
    var userPaused    = false;
    var lastUrl       = STREAM_URL;
    var usingHlsJs    = false;  // true when HLS.js is the active engine
    var isQMenuOpen   = false;

    /* ===================== HELPERS ===================== */
    function cleanUrl(u) {
        return String(u || '').trim().split('|')[0].trim().replace(/[,\s]+$/, '');
    }
    function isDirectCors(u) {
        return /in-mc-vod\.fancode\.com|dai-fancode\.pages\.dev/i.test(String(u || ''));
    }
    function unwrapProxy(u) {
        var cur = cleanUrl(u), guard = 0;
        while (guard++ < 4 && cur) {
            var m = cur.match(/https?:\/\/[^/]+(?:\/api)?(?:\/public)?\/(?:proxy|px)(?:\/[^?]*)?\?(?:u|url)=(.+)$/i);
            if (!m) break;
            try { cur = cleanUrl(decodeURIComponent(m[1])); } catch (_) { cur = cleanUrl(m[1]); }
        }
        return cur;
    }
    function toProxy(u, idx) {
        if (!u) return '';
        var clean = unwrapProxy(u);
        var px = PROXIES[typeof idx === 'number' ? idx : currentProxyIdx] || PROXIES[0];
        return px + encodeURIComponent(clean);
    }
    function hideLoading() { loadingEl.style.display = 'none'; }
    function showLoading() { loadingEl.style.display = 'flex'; errOverlay.classList.remove('show'); }
    function showError(msg) {
        hideLoading();
        errMsg.textContent = msg || 'Stream unavailable. Please try again.';
        errOverlay.classList.add('show');
    }
    function destroyPlayers() {
        if (hlsInst) { try { hlsInst.destroy(); } catch (e) {} hlsInst = null; }
        if (shakaPlayer) { try { shakaPlayer.destroy(); } catch (e) {} shakaPlayer = null; shakaUI = null; }
        try { video.pause(); video.removeAttribute('src'); video.src = ''; video.load(); } catch (e) {}
        hlsQBtn.style.display = 'none';
        hlsQMenu.classList.remove('open');
        hlsQMenu.style.display = 'none';
        usingHlsJs = false;
    }

    /* ===================== AUTO-RESUME ===================== */
    /*
     * Keeps live streams playing after buffering pauses.
     * Respects user-initiated pauses via Shaka's play button or HLS.js controls.
     */
    document.addEventListener('click', function (e) {
        var btn = e.target.closest('.shaka-play-button') || e.target.closest('[aria-label="Pause"]') || e.target.closest('[aria-label="Play"]');
        if (btn) {
            // flip userPaused based on current state at click time
            userPaused = !video.paused;
        }
    });

    video.addEventListener('play',  function () { userPaused = false; });
    video.addEventListener('pause', function () {
        if (video.ended) return;
        if (!userPaused) {
            // buffering / autoplay block — try to resume
            setTimeout(function () {
                if (video.paused && !video.ended && !userPaused) video.play().catch(function () {});
            }, 600);
        }
    });

    setInterval(function () {
        if (video.paused && !video.ended && !userPaused && !errOverlay.classList.contains('show')) {
            video.play().catch(function () {});
        }
    }, 3000);

    document.addEventListener('visibilitychange', function () {
        if (!document.hidden && video.paused && !video.ended && !userPaused) {
            video.play().catch(function () {});
        }
    });

    /* ===================== STALE VOD / LIVE EXTENSION ===================== */
    /*
     * When a live CDN stops refreshing the playlist, this re-constructs
     * future segment entries from the last known sequence + timestamp,
     * so the player doesn't stall with 404s on new segments.
     */
    var vodSafetyMs   = 8000;
    var vodExtendOff  = false;
    var vod404Count   = 0;

    function extendStalePlaylist(text) {
        if (vodExtendOff || !text) return text;
        if (text.indexOf('#EXTINF:') === -1) return text;
        if (text.indexOf('#EXT-X-ENDLIST') !== -1) return text;  // VOD — don't touch

        var lines = text.split('\n');
        var entries = [], headerLines = [], inHeader = true;
        var curDur = '4.000', curPdt = '';

        for (var i = 0; i < lines.length; i++) {
            var l = lines[i].trim();
            if (!l) continue;
            if (l.indexOf('#EXTINF:') === 0) {
                inHeader = false;
                var dm = l.match(/#EXTINF:([0-9.]+)/);
                if (dm) curDur = dm[1];
            } else if (l.indexOf('#EXT-X-PROGRAM-DATE-TIME:') === 0) {
                inHeader = false;
                curPdt = l.substring(25).trim();
            } else if (l.charAt(0) === '#') {
                if (inHeader && l.indexOf('#EXT-X-MEDIA-SEQUENCE:') !== 0) headerLines.push(l);
            } else {
                inHeader = false;
                entries.push({ dur: curDur, pdt: curPdt, uri: l });
                curPdt = '';
            }
        }

        if (!entries.length) return text;
        var last = entries[entries.length - 1];
        if (!last.pdt) return text;
        var lastMs = Date.parse(last.pdt);
        if (!lastMs || isNaN(lastMs)) return text;

        var seg = last.uri.match(/^(.*-)(\d+)(\.ts.*)$/i);
        if (!seg) return text;
        var prefix = seg[1], lastSeq = parseInt(seg[2], 10), suffix = seg[3];
        var segDurMs = Math.max(1000, Math.round((parseFloat(last.dur) || 4) * 1000));
        var elapsed  = Math.floor((Date.now() - lastMs - vodSafetyMs) / segDurMs);
        if (elapsed <= 0 || elapsed > 10800) return text;

        var windowSize = 75;
        var seqMatch = text.match(/#EXT-X-MEDIA-SEQUENCE:(\d+)/);
        var baseSeq  = seqMatch ? parseInt(seqMatch[1], 10) : 0;
        var startOff = Math.max(1, elapsed - (windowSize - 1));
        var totalV   = entries.length + elapsed;
        var newBase  = baseSeq + Math.max(0, totalV - windowSize);

        var finals = [];
        if (startOff === 1) {
            var keep = Math.max(0, entries.length - (windowSize - elapsed));
            finals = entries.slice(keep);
        }
        for (var k = startOff; k <= elapsed; k++) {
            finals.push({ dur: last.dur, pdt: new Date(lastMs + k * segDurMs).toISOString(), uri: prefix + (lastSeq + k) + suffix });
        }

        var out = headerLines.slice();
        out.push('#EXT-X-MEDIA-SEQUENCE:' + newBase);
        for (var j = 0; j < finals.length; j++) {
            out.push('#EXTINF:' + finals[j].dur + ',');
            if (finals[j].pdt) out.push('#EXT-X-PROGRAM-DATE-TIME:' + finals[j].pdt);
            out.push(finals[j].uri);
        }
        return out.join('\n') + '\n';
    }

    /* ===================== CUSTOM NO-CACHE PLAYLIST LOADER ===================== */
    /*
     * Fetches HLS playlists without browser cache (keeps live streams fresh)
     * and runs the stale-extension transform on direct CDN playlists.
     */
    function NoCacheLoader() { this._aborted = false; }
    NoCacheLoader.prototype.destroy = function () { this._aborted = true; };
    NoCacheLoader.prototype.abort   = function () { this._aborted = true; };
    NoCacheLoader.prototype.load    = function (ctx, cfg, cb) {
        var self = this, t0 = performance.now();
        fetch(ctx.url, { cache: 'no-store' })
            .then(function (r) {
                if (self._aborted) return;
                if (!r.ok) { cb.onError({ code: r.status, text: 'HTTP ' + r.status }, ctx, r, {}); return; }
                return r.text().then(function (data) {
                    if (self._aborted) return;
                    var isDirect = isDirectCors(ctx.url);
                    var final = isDirect ? extendStalePlaylist(data) : data;
                    var now = performance.now();
                    cb.onSuccess(
                        { url: ctx.url, data: final },
                        { trequest: t0, tfirst: now, tload: now, loaded: final.length, total: final.length,
                          retry: 0, chunkCount: 0, bwEstimate: 0, aborted: false,
                          loading: { start: t0, first: now, end: now }, parsing: { start: 0, end: 0 }, buffering: { start: 0, end: 0 } },
                        ctx, r
                    );
                });
            })
            .catch(function (e) {
                if (!self._aborted) cb.onError({ code: 0, text: (e && e.message) || 'Network error' }, ctx, null, {});
            });
    };

    /* ===================== HLS.js QUALITY MENU ===================== */
    function buildHlsQMenu() {
        hlsQMenu.innerHTML = '';
        if (!hlsInst) return;

        var items = [{ name: 'Auto', level: -1 }];
        (hlsInst.levels || []).forEach(function (l, i) {
            items.push({ name: (l.height ? l.height + 'p' : 'Level ' + (i + 1)), level: i });
        });
        items.sort(function (a, b) {
            if (a.level === -1) return -1;
            var ah = hlsInst.levels[a.level] ? hlsInst.levels[a.level].height || 0 : 0;
            var bh = hlsInst.levels[b.level] ? hlsInst.levels[b.level].height || 0 : 0;
            return bh - ah;
        });

        items.forEach(function (item) {
            var div = document.createElement('div');
            var active = (item.level === hlsInst.currentLevel || (item.level === -1 && hlsInst.autoLevelEnabled));
            div.className = 'hls-q-item' + (active ? ' active' : '');
            div.textContent = item.name;
            div.onclick = function (e) {
                e.stopPropagation();
                hlsInst.currentLevel = item.level;
                isQMenuOpen = false;
                hlsQMenu.classList.remove('open');
                hlsQMenu.style.display = 'none';
                updateQBadge();
                buildHlsQMenu();
            };
            hlsQMenu.appendChild(div);
        });
    }
    function updateQBadge() {
        if (!hlsInst) return;
        var lvl = hlsInst.currentLevel;
        var label = (lvl === -1 || hlsInst.autoLevelEnabled) ? 'Auto' : ((hlsInst.levels[lvl] && hlsInst.levels[lvl].height) ? hlsInst.levels[lvl].height + 'p' : 'Level ' + lvl);
        hlsQBtn.textContent = label + ' ▾';
    }

    hlsQBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        isQMenuOpen = !isQMenuOpen;
        hlsQMenu.style.display = isQMenuOpen ? 'flex' : 'none';
        hlsQMenu.classList.toggle('open', isQMenuOpen);
        if (isQMenuOpen) buildHlsQMenu();
    });
    document.addEventListener('click', function (e) {
        if (isQMenuOpen && !hlsQMenu.contains(e.target) && e.target !== hlsQBtn) {
            isQMenuOpen = false;
            hlsQMenu.classList.remove('open');
            hlsQMenu.style.display = 'none';
        }
    });

    /* ===================== HLS.js LOADER ===================== */
    function tryUnmute() {
        video.muted = false;
        video.play().catch(function () { video.muted = true; video.play().catch(function () {}); });
    }

    function loadWithHls(rawUrl, proxyIdx, gen, networkRetries, mediaRecovered) {
        if (streamGen !== gen) return;

        var isDirect = isDirectCors(rawUrl);
        var url = (isDirect || proxyIdx === -1) ? rawUrl : toProxy(rawUrl, proxyIdx);

        if (!window.Hls || !Hls.isSupported()) {
            /* Safari native HLS fallback */
            video.src = url;
            video.load();
            tryUnmute();
            video.addEventListener('loadedmetadata', function () { hideLoading(); }, { once: true });
            video.addEventListener('error', function () { showError('Stream unavailable. Please try again.'); }, { once: true });
            return;
        }

        if (hlsInst) { try { hlsInst.destroy(); } catch (e) {} hlsInst = null; }

        hlsInst = new Hls({
            enableWorker: true,
            lowLatencyMode: false,
            liveSyncDurationCount: 3,
            liveMaxLatencyDurationCount: 10,
            maxBufferLength: 30,
            maxMaxBufferLength: 60,
            pLoader: NoCacheLoader,
            xhrSetup: function (xhr) { xhr.withCredentials = false; }
        });

        usingHlsJs = true;

        hlsInst.on(Hls.Events.MANIFEST_PARSED, function () {
            if (streamGen !== gen) return;
            networkRetries = 0;
            hideLoading();
            tryUnmute();

            /* Show quality switcher if multiple levels */
            if (hlsInst.levels && hlsInst.levels.length > 1) {
                hlsQBtn.style.display = 'block';
                hlsQMenu.style.display = 'none';
                updateQBadge();
            }
        });

        hlsInst.on(Hls.Events.LEVEL_SWITCHED, function () { updateQBadge(); buildHlsQMenu(); });
        hlsInst.on(Hls.Events.FRAG_LOADED, function () { networkRetries = 0; hideLoading(); });

        hlsInst.on(Hls.Events.FRAG_LOAD_ERROR, function (ev, data) {
            if (data && data.response && data.response.code === 404) {
                vod404Count++;
                vodSafetyMs = Math.min(60000, vodSafetyMs + 8000);
                if (vod404Count >= 5) vodExtendOff = true;
            }
        });

        hlsInst.on(Hls.Events.ERROR, function (ev, data) {
            if (streamGen !== gen || !data.fatal) return;

            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                /* try next proxy */
                var next = proxyIdx + 1;
                if (!isDirect && next < PROXIES.length) {
                    var alt = toProxy(rawUrl, next);
                    hlsInst.loadSource(alt);
                    hlsInst.startLoad();
                    proxyIdx = next;
                    return;
                }
                /* one network retry */
                if (networkRetries < 1) {
                    networkRetries++;
                    try { hlsInst.startLoad(); } catch (e) {}
                    return;
                }
                /* try Shaka as last resort */
                if (!isDirect) {
                    fallbackToShaka(rawUrl, gen);
                } else {
                    showError('Stream unavailable. Please try again.');
                }

            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR && !mediaRecovered) {
                mediaRecovered = true;
                try { hlsInst.recoverMediaError(); } catch (e) {
                    fallbackToShaka(rawUrl, gen);

        hlsInst.attachMedia(video);
    }

    /* ===================== SHAKA FALLBACK (also used for DRM/.mpd) ===================== */
    function fallbackToShaka(rawUrl, gen) {
        if (streamGen !== gen) return;
        if (hlsInst) { try { hlsInst.destroy(); } catch (e) {} hlsInst = null; }
        usingHlsJs = false;
        hlsQBtn.style.display = 'none';
        hlsQMenu.style.display = 'none';

        showLoading();

        if (!window.shaka || !shaka.Player) {
            /* absolute fallback: native video src */
            video.src = rawUrl;
            video.load(); tryUnmute();
            video.addEventListener('loadedmetadata', hideLoading, { once: true });
            return;
        }

        shaka.polyfill.installAll();
        if (!shaka.Player.isBrowserSupported()) {
            video.src = rawUrl; video.load(); tryUnmute();
            video.addEventListener('loadedmetadata', hideLoading, { once: true });
            return;
        }

        var player = new shaka.Player();
        shakaPlayer = player;

        player.attach(video).then(function () {

            /* Shaka UI only on first load */

                    shakaUI.configure({
                        addBigPlayButton: true,
                        addSeekBar: true,
                        controlPanelElements: ['mute', 'play_pause', 'time_and_duration', 'spacer', 'quality', 'picture_in_picture', 'fullscreen'],
                        seekBarColors: { base: 'rgba(255,255,255,0.2)', buffered: 'rgba(255,255,255,0.4)', played: '#ff3b30' }
                    });
                } catch (uiErr) { /* UI optional */ }

        }).then(function () {
            if (streamGen !== gen) return;
            hideLoading();
            tryUnmute();
        }).catch(function (e) {
            if (streamGen !== gen) return;
            /* absolute last resort: native src */
            video.src = rawUrl; video.load(); tryUnmute();
            video.addEventListener('loadedmetadata', hideLoading, { once: true });
            setTimeout(hideLoading, 6000);
        });

        player.addEventListener('error', function (ev) {

            var detail = ev.detail;
            if (detail && detail.severity === shaka.util.Error.Severity.CRITICAL) {
                /* retry with native */
                video.src = rawUrl; video.load(); tryUnmute();
                video.addEventListener('loadedmetadata', hideLoading, { once: true });
                setTimeout(hideLoading, 6000);
            }
        });
    }

    /* ===================== MAIN LOAD ===================== */
    function loadStream(url) {
        var gen = ++streamGen;
        lastUrl = url;
        currentProxyIdx = 0;

        destroyPlayers();
        showLoading();

        var raw = cleanUrl(url);
        if (!raw) { showError('No stream URL provided.'); return; }

        /* DRM / DASH → Shaka only */
        if (raw.indexOf('.mpd') !== -1) {
            fallbackToShaka(raw, gen);
            return;
        }

        /* HLS → try HLS.js first (handles .ts segments, proxy rotation, stale extension) */
        loadWithHls(raw, isDirectCors(raw) ? -1 : 0, gen, 0, false);
    }

    /* ===================== RETRY BUTTON ===================== */
    errRetry.addEventListener('click', function () {
        errOverlay.classList.remove('show');
        loadStream(lastUrl);
    });

    /* ===================== BOOT ===================== */
    document.addEventListener('DOMContentLoaded', function () {
        showLoading();
        loadStream(STREAM_URL);
    });

    /* safety timeout — hide loading after 10s even if no event fires */
    setTimeout(function () {
        if (loadingEl.style.display !== 'none') hideLoading();
    }, 10000);
